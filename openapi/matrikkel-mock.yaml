openapi: 3.1.0
info:
  title: Matrikkel Mock API
  version: 0.1.0
  description: |
    Enkel mock for Matrikkel Geointegrasjon BasisService.
    SOAP kontrakt eksponeres på /geointegrasjon/matrikkel/wsapi/v1/BasisService?wsdl.
servers:
  - url: http://localhost:8085
# Ingen av rutene her krever token, og det er et valg, ikke en glipp.
# Matrikkelen er et offentlig register, og oppslagene her har ikke noe personsubjekt - de svarer på gater og eiendommer. Eierfiltreringen skjer på forespørselen, se apps/matrikkel-mock/src/server.ts.
# En tom security på dokumentnivå gjelder alle operasjonene under paths.
security: []

paths:
  /helse:
    get:
      summary: Helsesjekk
      responses:
        "200":
          description: Tjenesten svarer
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                  tjeneste:
                    type: string
                  tidspunkt:
                    type: string
                    format: date-time
                  antallGater:
                    type: integer
                  antallEiendommer:
                    type: integer
                  teigdatasett:
                    $ref: "#/components/schemas/TeigdatasettStatus"
                  eierforhold:
                    type: object
                    nullable: true
                    description: >
                      Hvilken fil eierforholdene ble lest fra, og hvor mange
                      matrikkelenheter som har en registrert eier. En enhet som
                      ikke star i filen har ingen.
                    properties:
                      fil:
                        type: string
                        nullable: true
                      antall:
                        type: integer
                  kilde:
                    type: object
                    description: >
                      Provenans. `metadata.kommuner` i filen oppsummeres her til
                      `antallKommuner` og en liste kommunenummer - den fulle listen
                      er 97 oppføringer og hører ikke i en helsesjekk.
                    additionalProperties: true
  /openapi.yaml:
    get:
      summary: Denne spesifikasjonen
      security: []
      description: >
        Tjenesten serverer sin egen spesifikasjon fra openapi/. Filen og koden
        holdes i takt av scripts/sjekk-openapi-dekning.ts.
      responses:
        "200":
          description: OpenAPI-dokumentet
          content:
            text/yaml:
              schema:
                type: string
  /openapi-ruter.json:
    get:
      summary: Spesifikasjonen lest, som JSON
      security: []
      description: >
        Den samme spesifikasjonen som /openapi.yaml, lest av
        apps/shared/openapi.ts: én oppføring per operasjon, med sammendrag,
        hjemmel og parametere. Finnes fordi en nettleser ikke kan lese YAML uten en
        parser, og sandkassen har ingen. Dette er kilden API-utforskeren på
        http://localhost:3001/utforsker rendrer.
      responses:
        "200":
          description: Ruteoversikten
          content:
            application/json:
              schema:
                type: object
                properties:
                  tjeneste: { type: string }
                  beskrivelse: { type: string }
                  server: { type: string }
                  ruter:
                    type: array
                    items:
                      type: object
                      properties:
                        sti: { type: string }
                        metode: { type: string }
                        linje: { type: integer }
                        sammendrag: { type: string }
                        beskrivelse: { type: string }
                        security:
                          type: array
                          items: { type: string }
                          description: Ordningene ruten godtar. Tom liste betyr åpen.
                        scopes:
                          type: array
                          items: { type: string }
                        parametere:
                          type: array
                          items:
                            type: object
                            properties:
                              navn: { type: string }
                              plassering: { type: string }
                              paakrevd: { type: boolean }
                              eksempel: { type: string }
                              beskrivelse: { type: string }
                        kroppEksempel: { type: string }
  /geointegrasjon/matrikkel/wsapi/v1/BasisService:
    get:
      summary: Hent mock WSDL
      parameters:
        - in: query
          name: wsdl
          required: true
          schema:
            type: boolean
      responses:
        "200":
          description: WSDL
          content:
            text/xml:
              schema:
                type: string
    post:
      summary: SOAP-kall mot BasisService
      requestBody:
        required: true
        content:
          text/xml:
            schema:
              type: string
      responses:
        "200":
          description: SOAP respons
          content:
            text/xml:
              schema:
                type: string
  /mock/matrikkel/gater:
    get:
      summary: List eller søk i gater
      parameters:
        - in: query
          name: gate
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
          description: Returner paginert respons når limit/offset brukes
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
        - in: query
          name: includeEiendommer
          required: false
          schema:
            type: boolean
          description: Inkluder eiendomsliste per gate (kan bli stor)
      responses:
        "200":
          description: Treff
  /mock/matrikkel/eiendommer:
    get:
      summary: List eiendommer
      parameters:
        - in: query
          name: gate
          required: false
          schema:
            type: string
        - in: query
          name: personId
          required: false
          description: >
            Snevrer treffet inn til eiendommer denne personen eier, og er det
            eneste som får `eiere` med i svaret. Uten den beskriver listen hva
            eiendommene er, ikke hvem som eier dem.
          schema:
            type: string
        - in: query
          name: adresse
          required: false
          description: >
            En full adresse sammenlignes med gatenavn, husnummer og husbokstav.
            Postnummer, poststed og adressetilleggsnavn kan tas med.
            Listen beholder alle eksakte kandidater, også ved live-fallback;
            den velger ikke første eiendom når adressen finnes flere steder.
          schema:
            type: string
        - in: query
          name: gnr
          required: false
          schema:
            type: integer
        - in: query
          name: bnr
          required: false
          schema:
            type: integer
        - in: query
          name: matrikkelId
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
      description: >
        `eiere` og `eierforhold` er bare med når `personId` er oppgitt, og da bare
        for den personen. Å spørre hvem som eier én eiendom er et grunnbokoppslag
        og finnes på /mock/matrikkel/eiendom/{matrikkelId}; å hente eierlistene for
        alle 227 eiendommene i en gate er bulkuttrekk. Eierforholdet kommer fra
        data/eierforhold.json, ikke fra matrikkelen - hjemmel ligger i grunnboken.
        Ved et fullstendig adresseoppslag følger live-fallback alle resultatsidene
        før listen pagineres. Adressetillegg i visningsteksten erstatter ikke
        gatenavn, husnummer og husbokstav i det strukturerte adressegrunnlaget.
      responses:
        "200":
          description: >
            Treffliste. Naken array uten `limit`/`offset`, ellers en konvolutt
            `{ items, total, offset, limit }`.
  /mock/matrikkel/naboteiger:
    get:
      summary: Hent lokale teiger i et avgrenset kartutsnitt
      description: >
        Leser samme mellomlagrede Bergen-uttrekk som teigoppslaget, uten nettverksreserve.
        Alle fem parametere kreves én gang hver; andre parametere avvises.
        Utsnittet er lengdegrad/breddegrad og må være høyst 500 meter langs hver side.
        Indeksen velger teiger med omsluttende rektangel som berører utsnittet,
        ikke bare bekreftede grensenaboer. Valgt eiendom kan være med i svaret.
        Alle seksjoner og hull beholdes. Høyst 200 teiger returneres; flere treff
        gir 400, aldri en avkortet liste. Uttrekket er ikke en komplett matrikkel.
        Eieropplysninger hentes ikke. Ingen grensekvalitet eller tviststatus oppdiktes.
      parameters:
        - in: query
          name: kommunenummer
          required: true
          description: Fire sifre, unntatt 0000. Bare Bergen 4601 har lokalt uttrekk.
          schema:
            type: string
            pattern: '^\d{4}$'
          example: "4601"
        - in: query
          name: vest
          required: true
          description: Vestlig lengdegrad, mindre enn ost.
          schema: { type: number, minimum: -180, maximum: 180 }
          example: 5.2545
        - in: query
          name: sor
          required: true
          description: Sørlig breddegrad, mindre enn nord og ikke på en pol.
          schema: { type: number, exclusiveMinimum: -90, exclusiveMaximum: 90 }
          example: 60.2533
        - in: query
          name: ost
          required: true
          description: Østlig lengdegrad.
          schema: { type: number, minimum: -180, maximum: 180 }
          example: 5.2559
        - in: query
          name: nord
          required: true
          description: Nordlig breddegrad, ikke på en pol.
          schema: { type: number, exclusiveMinimum: -90, exclusiveMaximum: 90 }
          example: 60.2541
      responses:
        "200":
          description: >
            Alle indekstreff, inkludert eventuell valgt eiendom. tilgjengelig betyr
            at Bergen-filen kan leses, ikke at den har full geografisk dekning.
            Andre kommuner gir ikke_dekket og tom liste uten å lese Bergen-filen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatrikkelNaboteigSvar"
        "400":
          description: Manglende eller ugyldige parametere, for stort utsnitt eller over 200 treff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeigFeil"
        "502":
          description: Uleselig, endret eller ugyldig lokal kilde. Ingen gammel indeks eller tom liste skjuler feilen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeigFeil"
  /mock/matrikkel/teiger:
    get:
      summary: Hent teiggeometri for en matrikkelenhet
      description: >
        Lokalt, reelt GeoJSON-uttrekk bundet til Bergen (4601). Kommunenummer
        finnes ikke i kildefilen og utledes ikke av gårds- og bruksnummer.
        Filen har ikke et eget CRS; GeoJSON-standardens EPSG:4326 brukes.
        Alle teiger for nøyaktig gnr/bnr/fnr returneres i kildefilens rekkefølge,
        inkludert alle seksjonsnumre og hull. fnr betyr festenummer, ikke
        fødselsnummer. snr og andre parametere støttes ikke; duplikate parametere
        avvises. Ingen helfil, eieropplysninger, oppdiktede teigidentifikatorer
        eller nøyaktighetsverdier eksponeres. Manglende treff er ikke en
        kildefeil og må skilles fra 502 av klienter som bruker en annen kilde
        som reserve.
      parameters:
        - in: query
          name: kommunenummer
          required: true
          description: Fire sifre. Bare 4601 dekkes av det lokale uttrekket.
          schema:
            type: string
            pattern: '^\d{4}$'
          example: "4601"
        - in: query
          name: gnr
          required: true
          description: Gårdsnummer som et positivt heltall skrevet med sifre.
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
          example: 105
        - in: query
          name: bnr
          required: true
          description: Bruksnummer som et ikke-negativt heltall skrevet med sifre.
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
          example: 209
        - in: query
          name: fnr
          required: false
          description: Festenummer. Alle seksjoner for matrikkelenheten beholdes.
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
            default: 0
          example: 0
      responses:
        "200":
          description: >
            FeatureCollection. For Bergen er kildestatus tilgjengelig, også ved
            en tom treffliste. Andre kommuner gir ikke_dekket og tom liste,
            uten å lese Bergen-filen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatrikkelTeigSvar"
        "400":
          description: Manglende eller ugyldige parametere
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeigFeil"
        "502":
          description: >
            Bergen-kilden mangler, kan ikke leses, endres under innlasting eller
            har ugyldig JSON, felter eller geometri. Ingen gammel indeks eller
            tom treffliste brukes til å skjule en kildefeil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeigFeil"
  /mock/matrikkel/eiendom-oppslag:
    get:
      summary: Hent eiendom via eksakt adresse
      parameters:
        - in: query
          name: adresse
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Treffer
        "404":
          description: Ikke funnet
  /mock/matrikkel/eiendom/{matrikkelId}:
    get:
      summary: Hent en eiendom
      parameters:
        - in: path
          name: matrikkelId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Treffer
        "404":
          description: Ikke funnet

  /docs:
    get:
      summary: Ruteoversikt som HTML
      responses:
        "200":
          description: HTML-side
          content:
            text/html:
              schema:
                type: string

components:
  schemas:
    TeigFeil:
      type: object
      additionalProperties: false
      required: [feil]
      properties:
        feil:
          type: string
          description: Feilmelding uten rådata eller full filsti.
    TeigdatasettStatus:
      type: object
      additionalProperties: false
      required: [status, kommunenummer, fil]
      description: >
        Siste kjente tilstand i minnet. Helsesjekken leser ikke teigfilen og
        utløser ikke innlasting eller en ny filkontroll. Antall og lastetid
        finnes bare etter vellykket innlasting. Feil her endrer ikke helsen
        for det eksisterende syntetiske matrikkelregisteret.
      properties:
        status:
          type: string
          enum: [ikke_lastet, laster, tilgjengelig, feil]
        kommunenummer:
          type: string
          const: "4601"
        fil:
          type: string
          description: Bare filnavnet, aldri en absolutt filsti.
        antallTeiger:
          type: integer
          minimum: 0
        antallEiendommer:
          type: integer
          minimum: 0
          description: Antall ulike kombinasjoner av GNR, BNR og FNR, uten seksjonsfilter.
        lastetTidspunkt:
          type: string
          format: date-time
          description: Når prosessen lastet filen, ikke når eiendommen ble målt.
    MatrikkelTeigSvar:
      type: object
      additionalProperties: false
      required: [kommunenummer, kildestatus, kilde, type, features]
      properties:
        kommunenummer:
          type: string
          pattern: '^\d{4}$'
        kildestatus:
          type: string
          enum: [tilgjengelig, ikke_dekket]
        kilde:
          type: object
          additionalProperties: false
          required: [navn, fil, uttrekksaar, koordinatsystem, syntetisk]
          properties:
            navn:
              type: string
            fil:
              type: [string, "null"]
              description: Bare filnavnet. Null når kommunen ikke dekkes.
              examples: [matrikkel_bk_25.json]
            uttrekksaar:
              type: [integer, "null"]
              description: >
                Året utledet av filnavnet matrikkel_bk_25.json er 2025. Dette er
                ikke en måledato eller en bekreftelse på at grensene er oppdaterte.
                Null når filnavnet ikke følger navnemønsteret eller kommunen
                ikke dekkes.
              examples: [2025]
            koordinatsystem:
              type: string
              const: "EPSG:4326"
            syntetisk:
              type: boolean
              const: false
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          items:
            $ref: "#/components/schemas/MatrikkelTeigFeature"
    MatrikkelNaboteigSvar:
      type: object
      additionalProperties: false
      required: [kommunenummer, kildestatus, kilde, type, features, avkortet]
      properties:
        kommunenummer:
          $ref: "#/components/schemas/MatrikkelTeigSvar/properties/kommunenummer"
        kildestatus:
          $ref: "#/components/schemas/MatrikkelTeigSvar/properties/kildestatus"
        kilde:
          $ref: "#/components/schemas/MatrikkelTeigSvar/properties/kilde"
        type: { type: string, const: FeatureCollection }
        features:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/MatrikkelTeigFeature"
        avkortet:
          type: boolean
          const: false
          description: Alle indekstreff returneres. Dette bekrefter ikke at alle eiendommer finnes i uttrekket.
    MatrikkelTeigFeature:
      type: object
      additionalProperties: false
      required: [type, id, geometry, properties]
      properties:
        type:
          type: string
          const: Feature
        id:
          type: integer
          minimum: 0
          description: Kildens OBJECTID, ikke en global teigidentifikator.
        geometry:
          oneOf:
            - type: object
              additionalProperties: false
              required: [type, coordinates]
              properties:
                type:
                  type: string
                  const: Polygon
                coordinates:
                  $ref: "#/components/schemas/TeigPolygon"
            - type: object
              additionalProperties: false
              required: [type, coordinates]
              properties:
                type:
                  type: string
                  const: MultiPolygon
                coordinates:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/TeigPolygon"
        properties:
          type: object
          additionalProperties: false
          required: [OBJECTID, OBJTYPE, GNR, BNR, FNR, SNR, AREAL, AREALMERKNAD, TINGLYST, ANTALL_GID, Shape_Area, Shape_Length]
          properties:
            OBJECTID: { type: integer, minimum: 0 }
            OBJTYPE: { type: string, const: Teig }
            GNR: { type: integer, minimum: 0 }
            BNR: { type: integer, minimum: 0 }
            FNR: { type: integer, minimum: 0 }
            SNR: { type: integer, minimum: 0 }
            AREAL:
              type: [number, "null"]
              minimum: 0
              description: Areal fra kilden. Enkelte objekter mangler verdi; null beholdes.
            AREALMERKNAD: { type: [string, "null"] }
            TINGLYST:
              type: string
              description: Kildens verdi, for eksempel Ja, Nei eller -. Sier ikke hvem som eier eiendommen.
            ANTALL_GID:
              type: integer
              minimum: 0
              description: Kildens antall matrikkelidentiteter; ikke et mål på nøyaktighet.
            Shape_Area: { type: number, minimum: 0 }
            Shape_Length: { type: number, minimum: 0 }
    TeigPolygon:
      type: array
      minItems: 1
      description: >
        Første ring er yttergrensen, senere ringer er hull. Ringer er lukket
        og har minst tre ulike posisjoner. Full topologisk kontroll utføres
        ikke ved innlasting av datasettet.
      items:
        type: array
        minItems: 4
        items:
          type: array
          minItems: 2
          maxItems: 3
          description: Endelig lengdegrad og breddegrad i grader, eventuelt en tredje høydekoordinat.
          prefixItems:
            - { type: number, minimum: -180, maximum: 180 }
            - { type: number, minimum: -90, maximum: 90 }
            - { type: number }
