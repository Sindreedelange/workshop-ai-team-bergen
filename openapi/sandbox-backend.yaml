openapi: 3.1.0
info:
  title: Sandbox Backend API
  version: 0.1.0
  description: API for prosesser, syntetiske data, søknader og revisjonslogg.
servers:
  - url: http://localhost:8080
paths:
  /helse:
    get:
      summary: Helsesjekk
      security: []
      responses:
        "200":
          description: Tjenesten svarer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Helse"
  /docs:
    get:
      summary: Ruteoversikt som HTML
      security: []
      description: Menneskeleselig liste over endepunktene, generert av http.ts.
      responses:
        "200":
          description: HTML-side
          content:
            text/html:
              schema:
                type: string
  /openapi.yaml:
    get:
      summary: Denne spesifikasjonen
      security: []
      description: >
        Tjenesten serverer sin egen spesifikasjon fra openapi/. Filen og koden
        holdes i takt av scripts/sjekk-openapi-dekning.ts.
      responses:
        "200":
          description: OpenAPI-dokumentet
          content:
            text/yaml:
              schema:
                type: string
  /openapi-ruter.json:
    get:
      summary: Spesifikasjonen lest, som JSON
      security: []
      description: >
        Den samme spesifikasjonen som /openapi.yaml, lest av
        apps/shared/openapi.ts: én oppføring per operasjon, med sammendrag,
        hjemmel og parametere. Finnes fordi en nettleser ikke kan lese YAML uten en
        parser, og sandkassen har ingen. Dette er kilden API-utforskeren på
        http://localhost:3001/utforsker rendrer.
      responses:
        "200":
          description: Ruteoversikten
          content:
            application/json:
              schema:
                type: object
                properties:
                  tjeneste: { type: string }
                  beskrivelse: { type: string }
                  server: { type: string }
                  ruter:
                    type: array
                    items:
                      type: object
                      properties:
                        sti: { type: string }
                        metode: { type: string }
                        linje: { type: integer }
                        sammendrag: { type: string }
                        beskrivelse: { type: string }
                        security:
                          type: array
                          items: { type: string }
                          description: Ordningene ruten godtar. Tom liste betyr åpen.
                        scopes:
                          type: array
                          items: { type: string }
                        parametere:
                          type: array
                          items:
                            type: object
                            properties:
                              navn: { type: string }
                              plassering: { type: string }
                              paakrevd: { type: boolean }
                              eksempel: { type: string }
                              beskrivelse: { type: string }
                        kroppEksempel: { type: string }
  /api/prosesser:
    get:
      summary: List prosesser
      security: []
      parameters:
        - name: inkluderMaler
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Returnerer også prosessmaler når satt til true.
      responses:
        "200":
          description: Prosessliste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProsessDefinisjon"
    post:
      summary: Opprett prosess
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProsessDefinisjonInput"
      responses:
        "201":
          description: Prosess opprettet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProsessDefinisjon"
  /api/prosesser/{prosessId}:
    get:
      summary: Hent prosess
      security: []
      parameters:
        - name: prosessId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prosess returnert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProsessDefinisjon"
    put:
      summary: Oppdater prosess
      security: []
      parameters:
        - name: prosessId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prosess oppdatert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProsessDefinisjon"
  /api/prosessoekter:
    post:
      summary: Opprett prosessøkt
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      responses:
        "201":
          description: Prosessøkt opprettet
  /api/prosessoekter/{oektsId}:
    get:
      summary: Hent prosessøkt
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      description: >
        `resultater` er samtykkegatet på tidspunktet for lesing, ikke for
        hentingen. Kildene lagres internt sammen med resultatet, så porten
        påvirkes ikke av at prosessdefinisjonen senere endres. Er samtykket
        trukket eller utløpt siden steget kjørte, mangler nøkkelen - både for
        DATA_FETCH-steget og for SJEKK-steget som bærer den samme opplysningen
        i grunnlaget sitt. Et resultat som er kjent ubeskyttet står. Et eldre
        resultat uten en entydig, løsbar kilde holdes tilbake. SUMMARY og SUBMIT
        svarer da 403 med beskjed om at prosessen må startes på nytt, mens et
        trukket eller utløpt samtykke gir beskjed om å samtykke på nytt. Det
        samme gjelder svaret fra `/svar`, `/handling`, `/neste` og `/forrige`.

        Hver lesing som faktisk serverer en samtykkegatet kilde gir en
        `DATA_LES` i revisjonsloggen, én rad per kilde per økt.

        `aktivtStegFullfort` sier om `/neste` kan aktivere neste steg. Klienter
        kan bruke feltet til å sperre navigasjonen uten å kopiere fullføringsreglene.

        Prosesser med `avslutning: veiledning` returnerer dette feltet på økten.
        Etter vellykket siste DATA_FETCH er status FULLFORT, og `sluttmelding`
        er «Veiledningen er ferdig. Ingen søknad er sendt.» Resultatet beholdes.
        Ingen søknad, oppgave eller SvarUt-forsendelse opprettes. Feil i handlingen
        lar økten være AKTIV for nytt forsøk. Avsluttede økter kan leses, ikke endres.
      parameters:
        - name: oektsId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prosessøkt returnert
  /api/prosessoekter/{oektsId}/svar:
    post:
      summary: Lagre svar i prosessøkt
      description: >
        Lagrer svar på det aktive QUESTION-steget. Bruk `/forrige` før et tidligere
        svar skal endres. Når et endret svar lagres, slettes svar og resultater fra
        senere steg, som dermed må kjøres på nytt.
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      parameters:
        - name: oektsId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Svar lagret
        "400":
          description: Steget er ikke det aktive QUESTION-steget
        "409":
          description: En steghandling pågår, eller prosessøkten ble endret av et annet kall
  /api/prosessoekter/{oektsId}/handling:
    post:
      summary: Utfør aktiv steg-handling
      description: >
        Utfører bare det aktive steget. En handling som feiler lagrer ikke et
        resultat. En mislykket DATA_FETCH blir derfor stående som ufullført og
        må prøves på nytt før `/neste` kan brukes. Kjøres et tidligere fullført
        steg på nytt, fjernes det gamle resultatet og alle senere svar og resultater
        før forsøket.
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      parameters:
        - name: oektsId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Handling utført
        "400":
          description: >
            Handlingen kan ikke utføres på det aktive steget, eller prosessøkten
            er allerede avsluttet. Når flere samtidige SUBMIT-kall gjelder samme
            økt, utføres det første. De senere kallene svarer stabilt med
            `Prosessøkten er avsluttet og kan ikke fortsette.` uten nye
            sideeffekter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feil"
        "403":
          description: >
            SUMMARY eller SUBMIT mangler et gyldig samtykkegrunnlag. Meldingen
            skiller mellom trukket eller utløpt samtykke og eldre resultater der
            kilden ikke kan fastslås.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feil"
        "409":
          description: >
            Navigasjon eller svar forsøkes mens en steghandling pågår, eller økten
            ble endret av et annet kall.
            Samtykkesteget: fiks-simulator avviste svaret, typisk fordi
            forespørselen alt er besvart eller trukket. Status og melding er
            samtykketjenestens egne, ikke omskrevet. DATA_FETCH og SJEKK svarer
            også 409 hvis stegets API ikke finnes i ressurskatalogen, med beskjed
            om å rette prosessdefinisjonen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feil"
        "502":
          $ref: "#/components/responses/OppstroemsFeil"
  /api/prosessoekter/{oektsId}/neste:
    post:
      summary: Gå til neste steg
      description: >
        Aktiverer neste steg når det aktive steget er fullført. Ruten utfører
        aldri steg-handlingen. Spørsmål må være besvart, samtykkeforespørsler må
        være besvart, og DATA_FETCH-, SJEKK- og SUMMARY-steg må være kjørt via
        `/handling`. Svaret på prosessøkten har `aktivtStegFullfort`, som klienten
        kan bruke til å sperre knappen før et kall.
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      parameters:
        - name: oektsId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Neste steg aktivert
        "400":
          description: Aktivt steg er ikke fullført, eller økten står på siste steg
        "409":
          description: En steghandling pågår, eller prosessøkten ble endret av et annet kall
  /api/prosessoekter/{oektsId}/forrige:
    post:
      summary: Gå til forrige steg
      description: >
        Flytter økten ett steg tilbake. Endres svaret på et tidligere QUESTION-steg
        etterpå, slettes alle senere svar og resultater.
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      parameters:
        - name: oektsId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Forrige steg aktivert
        "409":
          description: En steghandling pågår, eller prosessøkten ble endret av et annet kall
  /api/personer:
    get:
      summary: List syntetiske personer
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      description: >
        Hele befolkningen, 369 personer. Ingen innbygger har hjemmel til dette -
        ruten er i bandet «bred» og krever et maskin-token. Adressebeskyttede
        personer er maskert, se Person.
      responses:
        "200":
          description: Personer returnert
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
  /api/personer/{personId}:
    get:
      summary: Hent én person
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      description: >
        Folkeregisterliknende grunndata. Adressebeskyttede personer maskeres ved
        innlasting, ikke i denne ruten - se Person, og merk at maskeringen er
        kaller-uavhengig: person-031 ser «Skjermet person» også om seg selv.
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Person returnert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "403":
          $ref: "#/components/responses/ManglerHjemmel"
        "404":
          $ref: "#/components/responses/IkkeFunnet"

  /api/personer/{personId}/husstand:
    get:
      summary: Hent husstanden personen tilhører
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Husstand returnert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Husstand"
        "403":
          $ref: "#/components/responses/ManglerHjemmel"
        "404":
          $ref: "#/components/responses/IkkeFunnet"

  /api/personer/{personId}/inntekt:
    get:
      summary: Hent inntekt for person
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      description: >
        Krever registrert samtykke for datakilden "inntekt", jf. regelen
        consent-before-income i policies/access-policy.yaml. Alle treff
        revisjonslogges, også når tilgangen nektes.
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Inntektsgrunnlaget for husholdningen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inntektsgrunnlag"
        "403":
          $ref: "#/components/responses/ManglerSamtykke"
        "404":
          $ref: "#/components/responses/IkkeFunnet"
        "502":
          $ref: "#/components/responses/OppstroemsFeil"

  /api/personer/{personId}/legeerklaering:
    get:
      summary: Hent legeerklæringen til søknad om TT-kort
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      description: >
        Krever registrert samtykke for datakilden "helseopplysninger". En
        legeerklæring er en særlig kategori etter personvernforordningen artikkel
        9, og Vestland fylkeskommune hjemler behandlingen i artikkel 9 nr. 2
        bokstav a) jf. artikkel 6 nr. 1 bokstav a) - uttrykkelig samtykke. Alle
        treff revisjonslogges, også når tilgangen nektes.

        Svarer 200 med `legeerklaering: null` når personen ikke har noen. At
        søkeren mangler en erklæring er et svar hen skal få vite, ikke en feil.

        Erklæringen hentes fra pasientjournal-mock. Den integrasjonen finnes ikke i
        virkeligheten - se `apps/pasientjournal-mock/README.md`.
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Den gjeldende legeerklæringen, eller null
          content:
            application/json:
              schema:
                type: object
                properties:
                  personId:
                    type: string
                  legeerklaering:
                    oneOf:
                      - type: "null"
                      - type: object
                  syntetisk:
                    type: boolean
        "403":
          $ref: "#/components/responses/ManglerSamtykke"
        "404":
          $ref: "#/components/responses/IkkeFunnet"
        "502":
          $ref: "#/components/responses/OppstroemsFeil"

  /api/personer/{personId}/politiattest:
    get:
      summary: Les politiattesten innbyggeren framviser
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      description: >
        Krever registrert samtykke for datakilden "politiattest". Opplysninger om
        straffedommer og lovovertredelser har sin egen hjemmelsterskel etter
        personvernforordningen artikkel 10. Hjemmelen for selve vandelskontrollen
        er loven, jf. politiregisterloven § 36; samtykket gjelder lesingen. Alle
        treff revisjonslogges, også når tilgangen nektes.

        `formaal` er påkrevd: en attest gjelder for det formålet den er utstedt
        til, og formålet avgjør hjemmelen og attesttypen.

        Svaret er minimert med vilje. Det sier hvilken attesttype attesten er, når
        den ble utstedt og hvor mange anmerkninger den har - aldri hva de gjelder.
        Svaret lagres på prosessøkten og går inn i oppsummeringen, og
        oppsummeringen går til modellen.

        Svarer 200 med `politiattest: null` når personen ikke har noen attest for
        formålet. Attesten hentes fra politiattest-mock. Den integrasjonen finnes
        ikke i virkeligheten - se `apps/politiattest-mock/README.md`.
      parameters:
        - $ref: "#/components/parameters/PersonId"
        - name: formaal
          in: query
          required: true
          description: Rollen attesten er utstedt til.
          schema:
            type: string
            enum: [stottekontakt, barnehage, skole]
      responses:
        "200":
          description: Den gjeldende attesten i minimert form, eller null
          content:
            application/json:
              schema:
                type: object
                properties:
                  personId:
                    type: string
                  politiattest:
                    oneOf:
                      - type: "null"
                      - type: object
                        properties:
                          attestId:
                            type: string
                          formaal:
                            type: string
                          attesttype:
                            type: string
                          utstedt:
                            type: string
                            format: date
                          antallAnmerkninger:
                            type: integer
                  syntetisk:
                    type: boolean
        "400":
          description: formaal mangler
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feil"
        "403":
          $ref: "#/components/responses/ManglerSamtykke"
        "404":
          $ref: "#/components/responses/IkkeFunnet"
        "502":
          $ref: "#/components/responses/OppstroemsFeil"

  /api/personer/{personId}/barnehage:
    get:
      summary: Hent barnehageplasser for barna i husstanden
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Plassene. Tom liste når husstanden ikke har noen.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Barnehageplass"
        "403":
          $ref: "#/components/responses/ManglerHjemmel"
        "404":
          $ref: "#/components/responses/IkkeFunnet"

  /api/personer/{personId}/sfo:
    get:
      summary: Hent SFO-plasser for barna i husstanden
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Plassene. Tom liste når husstanden ikke har noen.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sfoplass"
        "403":
          $ref: "#/components/responses/ManglerHjemmel"
        "404":
          $ref: "#/components/responses/IkkeFunnet"

  /api/personer/{personId}/fritid:
    get:
      summary: Hent fritidsaktiviteter barna i husstanden deltar i
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      description: >
        Den eneste tjenesten som vurderes på barnets alder framfor skoletrinn.
        Ordningen fritidskort ligger i data/satser.json.
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Deltakelsene. Tom liste når husstanden ikke har noen.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fritidsdeltakelse"
        "403":
          $ref: "#/components/responses/ManglerHjemmel"
        "404":
          $ref: "#/components/responses/IkkeFunnet"

  /api/personer/{personId}/kontaktinfo:
    get:
      summary: Hent kontakt- og reservasjonsstatus fra kontaktregisteret (KRR)
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      description: >
        Slår opp personens syntetiske fødselsnummer i Fiks Kontaktregisteret
        (POST /register/api/v1/ks/{rolleId}/krr/person i fiks-simulator) og
        svarer med KRR-raden uendret: kan personen varsles digitalt, er de
        reservert, og hvilken målform foretrekker de. Ressursen finnes for at
        «sjekk reservasjon før valg av forsendelseskanal» skal være et gyldig
        DATA_FETCH-steg.

        Selve kanalvalget gjøres ikke her, og gjøres heller ikke av backend: et
        SUBMIT-steg sender kvitteringen på SvarUt, og SvarUt slår opp KRR på
        `mottaker.digitalId` og velger kanal selv. Det som fortsatt er byggeflate,
        er alt etter kvitteringen - vedtaksbrev, varsling og egen kanallogikk. Da
        er dette ruten å lese den av.

        Krever registrert samtykke for datakilden "kontaktinfo", som
        inntektsruten. Avvik fra ekte forvaltning: der slås KRR opp med hjemmel
        i eForvaltningsforskriften, uten samtykke - sandkassen samtykkegater
        ressursen fordi samtykke-før-data er mønsteret katalogen lærer bort.

        Oppslaget er best effort: får ressursen ikke noe svar fra registeret -
        fiks-simulator nede, eller personen står ikke i kontaktregisteret
        (under 15 år / ikke bosatt) - svarer den 200 med `advarsel` og `detalj`
        i stedet for å feile, slik at et DATA_FETCH-steg ikke velter
        prosessøkten. Oppslag revisjonslogges som DATA_LES med ressurs
        kontaktinfo, også de som degraderte til advarsel - unntatt under et
        SJEKK-steg, der SJEKK-utfallet logges i stedet, som for resten av
        katalogen.
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: KRR-raden, eller advarselen om at oppslaget ikke fikk svar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kontaktinfo"
        "403":
          $ref: "#/components/responses/ManglerSamtykke"
        "404":
          $ref: "#/components/responses/IkkeFunnet"

  /api/personer/{personId}/soknader:
    get:
      summary: List søknader personen har sendt inn
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Søknadene
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Soknad"
        "403":
          $ref: "#/components/responses/ManglerHjemmel"

  /api/soknader:
    post:
      summary: Opprett en søknad
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      description: Oppretter samtidig en oppgave i fiks-simulator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personId, prosessId]
              properties:
                personId:
                  type: string
                prosessId:
                  type: string
                prosessNavn:
                  type: string
                sporingsId:
                  type: string
      responses:
        "201":
          description: >
            Søknaden er lagret. Oppgaven i fiks-simulator er best effort: går
            den ikke gjennom, står `oppgave.advarsel` i stedet, med årsaken i
            `oppgave.detalj`. Et avvist kall og en utilgjengelig tjeneste ser
            like ut her - søknaden er lagret uansett.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoknadMedOppgave"

  /api/soknader/{soknadId}:
    get:
      summary: Hent én søknad
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      parameters:
        - name: soknadId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Søknad returnert
        "404":
          description: Fant ikke søknad

  /api/soknader/{soknadId}/forsendelse:
    get:
      summary: Hent statusen paa SvarUt-kvitteringen for én soeknad
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      description: >
        Tynn proxy foran statussøket i SvarUt
        (POST /svarut/api/v2/kontoer/{kontoId}/forsendelser/status-sok i
        fiks-simulator), autorisert som søknadens eier. Ruten finnes fordi
        SvarUt-flaten bare tar Maskinporten: nettleseren holder innbyggerens
        ID-porten-token, og kommunens hjemmel møter innbyggerens her.

        Statusen er utledet av tiden siden forsendelsen ble opprettet - MOTTATT,
        så SENDT_DIGITALT/SENDT_PRINT etter 10 sekunder, så LEST/PRINTET etter 60.
        En klient kan derfor polle ruten og se progresjonen; sluttilstandene er
        LEST, PRINTET og IKKE_LEVERT.

        404 dekker tre ting som alle er «ingen status å vise», ikke feil
        innbyggeren har gjort: søknaden finnes ikke, søknaden har ingen
        forsendelse (den kom fra POST /api/soknader, eller kvitteringen
        degraderte til en advarsel), eller SvarUt kjenner ikke forsendelsen.
        Meldingen sier hvilken. Er fiks-simulator utilgjengelig, er svaret 502 -
        dette er en lesing, ikke en best-effort-skriving.
      parameters:
        - name: soknadId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Statusen paa forsendelsen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forsendelsesstatussvar"
        "403":
          $ref: "#/components/responses/ManglerHjemmel"
        "404":
          $ref: "#/components/responses/IkkeFunnet"

  /api/katalog/datasett:
    get:
      summary: List de syntetiske datasettene
      security: []
      responses:
        "200":
          description: Datasett returnert

  /api/katalog/informasjonsmodeller:
    get:
      summary: List informasjonsmodellene datasettene låner vokabular fra
      security: []
      responses:
        "200":
          description: Informasjonsmodeller returnert

  /api/katalog/ressurser:
    get:
      summary: List ressursene DATA_FETCH- og SJEKK-steg kan peke på
      security: []
      description: >
        Ressurskatalogen i apps/sandbox-backend/src/ressurser.ts. Hver oppføring
        er samtidig et HTTP-endepunkt, et gyldig DATA_FETCH-mål og et gyldig
        SJEKK-mål. Bruk denne i stedet for å gjette URL-er når du skriver et
        nytt steg.
      responses:
        "200":
          description: Ressurskatalog returnert
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [metode, sti, ressurs]
                  properties:
                    metode:
                      type: string
                      example: GET
                    sti:
                      type: string
                      example: /api/personer/:personId/inntekt
                    ressurs:
                      type: string
                      description: Navnet ressursen får i revisjonsloggen.
                    beskrivelse:
                      type: string
                    kreverSamtykke:
                      type: string
                      nullable: true
                      description: Datakilde det må foreligge samtykke for, eller null.

  /api/matrikkel/gater:
    get:
      summary: List gater, eller hent nøkkeltall for én gate
      security: []
      description: >
        Uten ?gate returneres en liste. Med ?gate returneres en projeksjon uten
        eiendomslisten, siden den inneholder personId-ene til andre innbyggere.
      parameters:
        - name: gate
          in: query
          required: false
          schema:
            type: string
            example: Storgata
      responses:
        "200":
          description: Gate eller gateliste returnert
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/MatrikkelGateSummary"
                  - $ref: "#/components/schemas/MatrikkelGate"
        "404":
          description: >
            Fant ikke gaten. 221 gatenavn er for mange å sende tilbake på en
            skrivefeil, så kroppen peker på listen i stedet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feil"

  /api/matrikkel/mine-eiendommer:
    get:
      summary: Hent eiendommer søkeren er registrert som eier av
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      description: >
        Egne data, ikke det åpne gateregisteret: matrikkelen filtrerer på eier
        serverside, så eierlistene til andre i gaten når aldri hit. Til forskjell
        fra sjekk/eierforhold er den ikke bundet til en gate.
      parameters:
        - name: personId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Eiendomsliste returnert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MineEiendommer"
        "400":
          description: personId mangler
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feil"

  /api/matrikkel/sjekk/eierforhold:
    get:
      summary: Vurder om søkeren eier eiendom i en gitt gate
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      description: Brukes av SJEKK-steg. Følger samme kontrakt som andre sjekker.
      parameters:
        - name: personId
          in: query
          required: true
          schema:
            type: string
        - name: gate
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vurdering utført
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SjekkResultat"

  /api/regler/satser:
    get:
      summary: Hent moderasjonsordninger med regler og inntektsgrenser
      security: []
      description: >
        Satsene eies av kommunen og ligger i data/satser.json. Inntektsgrunnlaget
        beregnes derimot av fiks-simulator.
      responses:
        "200":
          description: Satser returnert

  /api/regler/sjekk/foreldrebetaling:
    get:
      summary: Vurder rett til en moderasjonsordning
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      description: >
        Deterministisk vurdering av inntektsgrunnlaget mot ordningen. Brukes av
        SJEKK-steg i prosessdefinisjoner. KI forklarer utfallet, men avgjør det
        aldri, jf. ai-no-decisions i policies/ai-policy.yaml.
      parameters:
        - name: personId
          in: query
          required: true
          schema:
            type: string
        - name: ordning
          in: query
          required: true
          description: Ordnings-id fra /api/regler/satser
          schema:
            type: string
            example: redusert-foreldrebetaling-barnehage
      responses:
        "200":
          description: Vurdering utført
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SjekkResultat"
        "400":
          description: Ukjent ordning eller manglende parameter
        "403":
          description: >
            Samtykke mangler. Vurderingen røper husholdningens
            inntektsgrunnlag og er derfor underlagt samme samtykkekrav som
            /api/personer/{personId}/inntekt.
        "502":
          $ref: "#/components/responses/OppstroemsFeil"

  /api/regler/sjekk/ordning:
    get:
      summary: Vurder rett til en ordning
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      description: >
        Vurderer én ordning i data/satser.json. Oppgi `ordning` direkte, eller
        `tjeneste` og la barnets trinn eller alder avgjøre hvilken ordning som
        gjelder - det siste er grunnen til at en husstand med barn i 1. trinn
        ikke lenger får «ingen SFO-plass på 2.–3. trinn» i svaret.

        Samtykke til inntekt kreves bare for ordninger som faktisk måles mot
        inntekt. Støttekontakt vurderes på behov, og henter da ingen inntekt -
        se regelKreverInntekt i vilkaar.ts.

        `/api/regler/sjekk/foreldrebetaling` er et alias for denne. Navnet sier
        foreldrebetaling, men ruten har alltid tatt enhver ordning.
      parameters:
        - name: personId
          in: query
          required: true
          schema:
            type: string
        - name: ordning
          in: query
          required: false
          description: Id fra data/satser.json. Enten denne eller tjeneste.
          schema:
            type: string
            example: redusert-foreldrebetaling
        - name: tjeneste
          in: query
          required: false
          schema:
            type: string
            enum: [barnehage, sfo, fritid]
      responses:
        "200":
          description: Vurdering utført
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SjekkResultat"
        "400":
          description: Ukjent ordning, ukjent tjeneste eller manglende parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feil"
        "403":
          $ref: "#/components/responses/ManglerSamtykke"
        "502":
          $ref: "#/components/responses/OppstroemsFeil"

  /api/vandel/formaal:
    get:
      summary: Bekreftelsen på formål for en rolle
      security: []
      description: >
        Kommunens eget dokument: hvilket formål som gjelder for rollen, hvilken
        hjemmel kontrollen gjøres etter, hvilken attesttype formålet gir, og hvor
        gammel attesten kan være. Dette er bekreftelsen innbyggeren legger ved
        søknaden til politiet.

        Åpen fordi den ikke har noe personsubjekt: den sier hva som gjelder for
        rollen, ikke noe om den som søker.
      parameters:
        - name: rolle
          in: query
          required: true
          schema:
            type: string
            enum: [stottekontakt, barnehage, skole]
      responses:
        "200":
          description: Bekreftelsen
          content:
            application/json:
              schema:
                type: object
                properties:
                  rolle:
                    type: string
                  ordning:
                    type: string
                  formaal:
                    type: string
                  kilde:
                    type: string
                    description: Kilden som gjelder for ordningen rollen peker på.
                  hjemmel:
                    type: string
                  attesttype:
                    type: string
                  maksAlderMaaneder:
                    type: integer
                    description: >-
                      Hvor gammel attesten kan være når den framvises. Samme tall for
                      alle ordningene, fra TREMAANEDSGRENSEN i apps/shared/politiattest.ts:
                      beviset attesten bærer skriver det som expirationDate, og de to må
                      være enige.
                  slikSoekerDu:
                    type: string
                  oppbevaring:
                    type: string
                  syntetisk:
                    type: boolean
        "400":
          description: rolle mangler eller er ukjent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feil"

  /api/regler/sjekk/vandel:
    get:
      summary: Vandelskontroll for en rolle
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      description: >
        Vurderer politiattesten mot ordningen rollen peker på. Krever registrert
        samtykke for datakilden "politiattest".

        Utfallet står i `grunnlag.vandelsutfall` og har seks verdier. To av dem
        slipper søknaden gjennom: `godkjent`, og `krever_manuell_vurdering` for en
        anmerkning som ikke utelukker automatisk - da skal et menneske vurdere
        egnetheten, og søknaden går inn til den vurderingen. De fire andre er
        avslag: `mangler_attest`, `feil_attesttype`, `attest_for_gammel` og
        `absolutt_utelukkelse`.

        Bare det loven avgjør, avgjøres her. Barnehageloven § 30 og opplæringslova
        § 17-11 utelukker den som er dømt for seksuelle overgrep mot mindreårige,
        uten skjønn. Helse- og omsorgstjenesteloven § 5-4 utelukker ingen direkte,
        så der er hver merknad en egnethetsvurdering.

        `grunnlag` bærer aldri hva anmerkningen gjelder.
      parameters:
        - name: personId
          in: query
          required: true
          schema:
            type: string
        - name: rolle
          in: query
          required: true
          schema:
            type: string
            enum: [stottekontakt, barnehage, skole]
      responses:
        "200":
          description: Vurdering utført
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SjekkResultat"
        "400":
          description: Ukjent rolle eller manglende parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feil"
        "403":
          $ref: "#/components/responses/ManglerSamtykke"
        "502":
          $ref: "#/components/responses/OppstroemsFeil"

  /api/husstander/{husstandId}/inntektsgrunnlag:
    get:
      summary: Hent husholdningens inntektsgrunnlag
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      description: >
        Henter beregningen fra fiks-simulator for hele husholdningen. Samme data
        som personruten, og derfor samme samtykkekrav.
      parameters:
        - name: husstandId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Beregning returnert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inntektsgrunnlag"
        "403":
          $ref: "#/components/responses/ManglerSamtykke"
        "404":
          $ref: "#/components/responses/IkkeFunnet"
        "502":
          $ref: "#/components/responses/OppstroemsFeil"

  /api/revisjonslogg:
    get:
      summary: Hent hele revisjonsloggen
      security:
        - maskinporten: [ks:innbyggerdialog:les]
      responses:
        "200":
          description: Revisjonslogg returnert
    post:
      summary: Registrer en revisjonshendelse
      security:
        - maskinporten: [ks:innbyggerdialog:revisjon]
      description: >
        Denne tjenesten eier revisjonsloggen. Andre tjenester, som
        fiks-simulator og ai-gateway, sender hendelser hit i stedet for å
        skrive loggfilen selv, slik at det bare finnes én skriver.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handling]
              properties:
                handling:
                  type: string
                  description: >-
                    `DATA_LES` og `DATA_NEKTET` gjelder datatilgang; `DATA_NEKTET`
                    betyr hjemmel uten samtykke. `TILGANG_NEKTET` er noe annet: der
                    manglet hjemmelen selv, altså 401 eller 403 før samtykke i det hele
                    tatt ble vurdert. De to skal ikke slås sammen - forskjellen er hele
                    poenget.
                  example: SAMTYKKE_OPPRETTET
                ressurs:
                  type: string
                sporingsId:
                  type: string
                omfatter:
                  type: array
                  description: >-
                    Hvilke personer dataene faktisk gjaldt, som personId. Utelates når
                    det ikke sier mer enn aktor alt gjør. Finnes fordi de to ikke er
                    samme sak: et inntektsoppslag kombinerer alle foresatte i
                    husstanden, så for de 68 av 200 husstandene med to foresatte leses
                    en partners skattedata på styrken av søkerens samtykke.
                  items:
                    type: string
                    example: person-009
                aktor:
                  type: object
                  description: >-
                    Hvem som kalte, avledet av tokenet - ikke hvem det ble spurt om.
                    Identifikatorrommene er bevisst ulike: `id` er fødselsnummer for
                    en innbygger, fordi det er hva ID-porten-tokenet bærer, mens
                    `paaVegneAv` er personId, som er sandkassens domeneidentifikator.
                  properties:
                    type:
                      type: string
                      enum: [innbygger, system, utvikler, ukjent]
                      description: >-
                        `innbygger` er en autentisert person via ID-porten. `system` er
                        en maskinklient med eget scope. `utvikler` er prosessbyggeren,
                        som ikke er en innbygger. `ukjent` betyr at ingen ble
                        autentisert - det skjer bare med AUTH_ENFORCE=false, og skal se
                        feil ut.
                    id:
                      type: string
                      description: >-
                        Fødselsnummer for `innbygger`, client_id for `system`, null for
                        `ukjent`.
                      example: "12818800078"
                    acr:
                      type: string
                      description: Sikkerhetsnivået personen ble autentisert på.
                      example: idporten-loa-high
                    paaVegneAv:
                      type: string
                      description: >-
                        For `system`: hvilken person kallet gjaldt. En maskin opptrer
                        aldri *som* innbyggeren, men kan opptre på vegne av en.
                      example: person-001
      responses:
        "201":
          description: Hendelsen er registrert
        "400":
          description: Hendelsen mangler handling

  /api/revisjonslogg/{sporingsId}:
    get:
      summary: Hent revisjonshendelsene for én flyt
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      parameters:
        - name: sporingsId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hendelser returnert

  /api/garasje/adresser:
    get:
      summary: Finn adresser til tiltakssjekken
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      description: >
        Søker i Kartverkets offentlige adresseregister, ikke i eierregisteret.
        Alle kandidater returneres. Ingen personidentitet eller token sendes til
        karttjenesten. Ingen søknad eller prosessøkt opprettes.
      parameters:
        - name: sok
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 120
          example: Litle Milde 65
        - $ref: "#/components/parameters/GarasjeKommune"
      responses:
        "200":
          description: Adressetreff, tom liste når ingen adresse ble funnet
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GarasjeAdresse"
        "400":
          description: Ugyldig eller manglende søketekst
        "401":
          description: Innlogging mangler eller tokenet er ugyldig
        "502":
          $ref: "#/components/responses/OppstroemsFeil"

  /api/garasje/veiledning:
    get:
      summary: Strukturert kunnskapsgrunnlag for tiltakssjekken
      security: []
      description: >
        Offentlige fagbegreper og nasjonale vilkår fra de delte kodemodulene.
        Ingen eiendom eller person er vurdert. Modellen kan forklare grunnlaget,
        men skal ikke avgjøre søknadsplikten eller finne på utnyttelsesgrenser.
      responses:
        "200":
          description: Fagbegreper, måleenheter, nasjonale vilkår og tydelige avgrensninger
          content:
            application/json:
              schema:
                type: object
                required: [begreper, nasjonaleKrav, planbestemmelserKontrollert, regelutfall, avgrensning]
                properties:
                  begreper:
                    type: array
                    items:
                      type: object
                      required: [id, navn, forklaring, kilde]
                      properties:
                        id: { type: string }
                        navn: { type: string }
                        forklaring: { type: string }
                        kilde: { type: string, format: uri }
                  nasjonaleKrav:
                    type: object
                    properties:
                      regelsett: { type: string }
                      versjon: { type: string }
                      kilde: { type: string, format: uri }
                      virkeomraade: { type: string }
                      tallkrav:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            navn: { type: string }
                            operator: { type: string, enum: [maks, min, lik] }
                            verdi: { type: number }
                            enhet: { type: string }
                      andreVilkaar: { type: array, items: { type: string } }
                      uavklart: { type: string }
                      modellrolle: { type: string }
                  planbestemmelserKontrollert: { type: boolean, const: false }
                  kildeTilPlanbestemmelser: { type: [string, "null"], description: Kun den valgte kommunens kilde, ellers null. }
                  kommunenummer: { type: [string, "null"] }
                  kommunaleOppsett:
                    type: array
                    description: Eksplisitt konfigurerte kommuner. Oppsettene brukes aldri som reserve for en annen kommune.
                    items:
                      type: object
                      properties:
                        kommunenummer: { type: string }
                        navn: { type: string }
                        planId: { type: string }
                        versjon: { type: string }
                        bestemmelserUrl: { type: string, format: uri }
                  sonetyper:
                    type: array
                    description: Verifiserte soner, koblet til kommune, plan, versjon og kilde.
                    items:
                      type: object
                      properties:
                        sonetype: { type: string }
                        navn: { type: string }
                        KPAREALFORMAL: { type: integer }
                        AREALST: { type: integer }
                        kilde: { type: object }
                        tillattUtnyttelse: { type: object, description: Bare til stede når en konkret bestemmelse er kontrollert. }
                  soner: { type: array, items: { type: object } }
                  arealFraKart:
                    type: object
                    properties:
                      tomtearealM2: { type: [number, "null"] }
                      kartlagtBebygdArealM2: { type: [number, "null"] }
                      kartlagtAndelProsent: { type: [number, "null"] }
                      juridiskUtnyttelsesgrad: { type: string, const: uavklart }
                      tillattUtnyttelse: { type: string, const: uavklart }
                      forklaring: { type: string }
                  regelutfall: { type: string, const: ikke_vurdert }
                  avgrensning: { type: string }

  /api/garasje/grunnlag:
    get:
      summary: Hent eiendomsgrunnlag og tidlige planvarsler for valgt tiltakstype
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      description: >
        Adressen og gnr./bnr. kontrolleres mot adresseregisteret. Plangrunnlaget
        hentes for adressepunktet eller en uttrykkelig valgt plassering.
        Punktet representerer ikke hele tiltakets omriss. Manglende eller
        mislykkede kartoppslag fremgår av kildestatusen og er ikke bevis på at
        området er fritt for begrensninger.
        Tomtegrenser hentes først fra matrikkelmockens lokale teiguttrekk.
        Kartverkets eiendoms-API brukes når kommunen ikke dekkes eller
        eiendommen mangler. Feil i den lokale kilden gir kildefeil uten et
        stille kildebytte. Kilder viser filnavn og uttrekksår for lokale treff.
        Når tiltakstype er oppgitt etter klientens bekreftelse, returneres
        tiltaksvarsler uten at tiltakets mål eller øvrige svar kreves.
        Varslene bruker samme planregler som sluttvurderingen. Et treff i Bergen
        plan 6170063 gir gjerdevarsel om § 7 bokstav d med kildehenvisning.
        Dette er avklaringsbehov, ikke byggetillatelse, avslag eller ferdig søknadsvurdering.
      parameters:
        - $ref: "#/components/parameters/GarasjeAdresse"
        - $ref: "#/components/parameters/GarasjeKommune"
        - $ref: "#/components/parameters/GarasjeGnr"
        - $ref: "#/components/parameters/GarasjeBnr"
        - $ref: "#/components/parameters/GarasjeLat"
        - $ref: "#/components/parameters/GarasjeLon"
        - $ref: "#/components/parameters/GarasjeTiltakstype"
      responses:
        "200":
          description: Datagrunnlag med kilder, dekning og uavklarte forhold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarasjeGrunnlag"
        "400":
          description: Manglende eller ugyldige parametere
        "401":
          description: Innlogging mangler eller tokenet er ugyldig
        "404":
          description: Ingen entydig adresse med oppgitt eiendomsidentitet
        "502":
          $ref: "#/components/responses/OppstroemsFeil"

  /api/garasje/sjekk:
    get:
      summary: Veiledende, regelbasert vurdering av bekreftet byggetiltak
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      description: >
        Tilstandsfri sjekk, ingen søknad sendes. Tiltaksopplysningene sendes som
        JSON i tiltak. Eiendoms- og plangrunnlag hentes på nytt på serveren;
        klienten kan ikke overstyre arealformål eller kildestatus. Nasjonale
        unntaksvilkår vurderes separat fra uavklarte planforhold og andre krav.
        Manglende kunnskap gir ikke et ubetinget unntak fra søknadsplikt.
        Datatilgang og vurdering etterlater revisjonsspor.
        bebygdEiendom i tiltak beholdes av hensyn til eldre klienter, men
        overstyres alltid med hentet grunnlag.bebyggelse før vurderingen.
        Kartlagt eksisterende bebyggelse er ikke dokumentasjon på lovlig bruk.
      parameters:
        - $ref: "#/components/parameters/GarasjeAdresse"
        - $ref: "#/components/parameters/GarasjeKommune"
        - $ref: "#/components/parameters/GarasjeGnr"
        - $ref: "#/components/parameters/GarasjeBnr"
        - $ref: "#/components/parameters/GarasjeLat"
        - $ref: "#/components/parameters/GarasjeLon"
        - $ref: "#/components/parameters/GarasjeTiltakstype"
        - name: tiltak
          in: query
          required: true
          description: >
            JSON-kodet Byggetiltak eller eldre GarasjeTiltak, maksimalt 5000 tegn.
            Eldre objekter uten tiltakstype behandles som frittliggende bygning.
            Nye objekter har bekreftet tiltakstype og bare denne typens opplysninger.
          schema:
            type: string
            maxLength: 5000
      responses:
        "200":
          description: Vurdering med det faktisk brukte grunnlaget
          content:
            application/json:
              schema:
                type: object
                required: [grunnlag, vurdering, sporingsId]
                properties:
                  grunnlag:
                    $ref: "#/components/schemas/GarasjeGrunnlag"
                  vurdering:
                    $ref: "#/components/schemas/GarasjeVurdering"
                  sporingsId:
                    type: string
        "400":
          description: Ugyldige tiltaksopplysninger eller parametere
        "401":
          description: Innlogging mangler eller tokenet er ugyldig
        "404":
          description: Ingen entydig adresse med oppgitt eiendomsidentitet
        "502":
          $ref: "#/components/responses/OppstroemsFeil"

  /api/garasje/prosess/sjekk:
    get:
      summary: Vurder bekreftede tiltaksopplysninger fra en aktiv prosessøkt
      security:
        - idporten: []
        - maskinporten: [ks:innbyggerdialog:les]
      description: >
        Intern katalogressurs for DATA_FETCH-steget garasje-vurdering i
        tiltakssjekk. Kalles via POST /api/prosessoekter/{oektsId}/handling,
        aldri direkte fra klienten. Direkte HTTP-kall mangler prosesskontekst og
        gir 400. Bare personId godtas i URL-en, ikke tiltak eller plangrunnlag.
        Tiltaket utledes fra det lagrede svaret på garasje-prosjekt.
        Eiendomslisten leses på nytt med samme hjemmelskontroll og revisjonsspor
        som /api/matrikkel/mine-eiendommer. Den valgte adressen må være blant
        søkerens eiendommer. Kommunenummer, adresse og gnr./bnr. kontrolleres deretter
        mot offentlig adresseregister før kart- og plangrunnlag hentes på nytt.
        Faste regler lager vurderingen. Ingen modell, søknad, oppgave eller
        SvarUt-forsendelse brukes. Uavklarte kartkilder er synlige i resultatet
        og betyr ikke at forholdet er oppfylt.
      parameters:
        - name: personId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Veiledning med kildegrunnlag, også ved søknadsplikt eller uavklarte forhold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarasjeProsessResultat"
        "400":
          description: Manglende prosesskontekst, ubekreftet plassering eller ugyldige svar
        "401":
          description: Innlogging mangler eller tokenet er ugyldig
        "403":
          description: Annen persons økt eller eiendom som ikke er registrert på søkeren
        "404":
          description: Ingen entydig adresse med oppgitt gnr./bnr.
        "502":
          $ref: "#/components/responses/OppstroemsFeil"

components:
  securitySchemes:
    maskinporten:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Maskin-til-maskin. RS256-signert JWT fra digdir-mock, hentet med
        grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer mot POST /token.
        Krever scope `ks:innbyggerdialog:les` og aud `sandbox-backend` - et token utstedt for en annen
        tjeneste avvises med 401, som er hele poenget med audience-begrensning.
        Hent ett med `scripts/token.ts --maskinporten ks:innbyggerdialog:les --resource sandbox-backend`.
    idporten:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Innbygger. RS256-signert JWT fra digdir-mock via authorization_code med
        PKCE. Bærer `pid` (fødselsnummer) og `acr`. Tokenets `pid` må slå opp til
        den personen forespørselen gjelder - ellers 403, ikke 401: forskjellen på
        «vi vet ikke hvem du er» og «vi vet, og du har ikke lov».
        Hent ett med `scripts/token.ts --innbygger <personId>`.
  parameters:
    GarasjeTiltakstype:
      name: tiltakstype
      in: query
      required: false
      description: >
        Tiltakstypen innbyggeren har bekreftet. Sendes som én verdi.
        Ukjente kodeverdier og gjentatte verdier gir 400. Kodeverdien ukjent
        er gyldig og gir generelle avklaringsbehov.
        På /api/garasje/sjekk må verdien samsvare med tiltakets type.
        Eldre tiltak uten type regnes som frittliggende.
      schema:
        type: string
        enum: [frittliggende, tilbygg, gjerde, fasade, ukjent]
    GarasjeKommune:
      name: kommunenummer
      in: query
      required: false
      description: >
        Kommunenummeret fra eiendommen. Ingen kommune brukes som standard.
        Uten avgrensning må adresse og gnr./bnr. gi ett entydig treff.
        Kommuner uten tilkoblede plankilder får uavklart plangrunnlag.
      schema:
        type: string
        pattern: '^(?!0000)\d{4}$'
    GarasjeAdresse:
      name: adresse
      in: query
      required: true
      schema: { type: string, minLength: 3, maxLength: 120 }
      example: Litle Milde 65
    GarasjeGnr:
      name: gnr
      in: query
      required: true
      schema: { type: integer, minimum: 1, maximum: 100000 }
      example: 105
    GarasjeBnr:
      name: bnr
      in: query
      required: true
      schema: { type: integer, minimum: 1, maximum: 1000000 }
      example: 209
    GarasjeLat:
      name: lat
      in: query
      required: false
      description: Breddegrad i EPSG:4258. Krever også lon og må være i nærheten av valgt adresse.
      schema: { type: number, exclusiveMinimum: -90, exclusiveMaximum: 90 }
    GarasjeLon:
      name: lon
      in: query
      required: false
      description: Lengdegrad i EPSG:4258. Krever også lat.
      schema: { type: number, minimum: -180, maximum: 180 }
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
        example: person-001

  responses:
    IkkeFunnet:
      description: Fant ikke ressursen
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Feil"
    ManglerHjemmel:
      description: >
        Tokenet er gyldig, men gir ikke hjemmel her: `pid` er en annen person enn
        forespørselen gjelder, eller maskinen mangler scope. `grunn` er
        mangler_hjemmel.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Feil"
    OppstroemsFeil:
      description: >
        Et kall videre til fiks-simulator, ai-gateway eller matrikkel-mock nådde
        ikke fram, eller tjenesten svarte 5xx. `detalj` sier hva som feilet og
        `hint` hva som mangler å kjøre. Én ting sendes videre med sin egen status
        i stedet: samtykkekallenes 4xx, der tjenesten har vurdert innbyggerens
        egen forespørsel. Se upstream.ts.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Feil"
    ManglerSamtykke:
      description: >
        Hjemmelen er i orden, men samtykket er ikke. To tilfeller, skilt av
        `grunn`: mangler_samtykke når ingen har samtykket, utloept_samtykke når
        noen gjorde det og samtykket har gått ut. Begge revisjonslogges som
        DATA_NEKTET.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Feil"

  schemas:
    GarasjePunkt:
      type: object
      required: [lat, lon]
      additionalProperties: false
      description: Geografisk punkt i EPSG:4258, ikke hele byggets omriss.
      properties:
        lat: { type: number, exclusiveMinimum: -90, exclusiveMaximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
    GarasjeAdresse:
      type: object
      required: [adressetekst, kommunenummer, gardsnummer, bruksnummer, festenummer, undernummer, punkt]
      properties:
        adressetekst: { type: string }
        kommunenavn: { type: string, description: Kommunenavn fra adresseregisteret, når tilgjengelig. }
        kommunenummer:
          type: string
          pattern: '^(?!0000)\d{4}$'
        gardsnummer: { type: integer }
        bruksnummer: { type: integer }
        festenummer: { type: integer }
        undernummer: { type: integer }
        punkt:
          $ref: "#/components/schemas/GarasjePunkt"
    GarasjeKilde:
      type: object
      required: [id, navn, url, hentet, status]
      properties:
        id: { type: string }
        navn: { type: string }
        url: { type: string, format: uri }
        hentet: { type: string, format: date-time }
        status: { type: string, enum: [ok, ingen_treff, feil, ikke_sjekket] }
        merknad: { type: string }
        fil: { type: string, description: Filnavn når grunnlaget er hentet fra et lokalt uttrekk gjennom matrikkelmocken. }
        uttrekksaar: { type: integer, description: Årstallet uttrekket er merket med, ikke tidspunktet da eiendommen ble oppdatert. }
        koordinatsystem: { type: string, enum: ["EPSG:4326", "EPSG:4258"] }
    GarasjePolygon:
      type: object
      required: [id, ringer]
      properties:
        id: { type: string }
        teigId: { type: integer }
        matrikkelnummer: { type: string }
        kildeObjektId: { type: integer, description: OBJECTID i lokalt uttrekk, aldri en Matrikkel-teig-ID. }
        registrertArealM2: { type: number, description: Teigareal oppgitt i uttrekket, atskilt fra beregnet geometriareal. }
        kvalitetsklasse: { type: string, enum: [Grønt, Gult, Rødt] }
        oppdatert: { type: string, description: Oppdateringsdato slik den er oppgitt av Kartverket. }
        teig:
          type: object
          description: Eiendomsidentitet og kvalitet fra kilden. Fravær av tvistopplysning betyr ikke at ingen tvist finnes.
          required: [gnr, bnr, fnr]
          properties:
            gnr: { type: integer }
            bnr: { type: integer }
            fnr: { type: integer, description: Festenummer, ikke fødselsnummer. }
            teigId: { type: integer }
            kvalitet: { type: string }
            tvist: { type: string }
        ringer:
          type: array
          description: >
            Lukkede geografiske ringer, inkludert eventuelle hull. Hvert punkt er
            [lon, lat]. Eiendomskildens koordinatsystem står i kilder og
            eiendomsgeojson. Lokal GeoJSON er EPSG:4326, API-oppslag er EPSG:4258.
          items:
            type: array
            minItems: 4
            items:
              type: array
              minItems: 2
              maxItems: 2
              items: { type: number }
    GarasjeRing:
      type: array
      minItems: 4
      description: Lukket geografisk ring av [lengdegrad, breddegrad]. Koordinatsystemet følger eiendomskilden.
      items:
        type: array
        minItems: 2
        maxItems: 2
        items: { type: number }
    GarasjeEiendomsGeoJson:
      type: object
      required: [type, features]
      description: >
        Validert og normalisert GeoJSON fra lokalt teiguttrekk eller
        Kartverkets eiendoms-API. Kilden identifiseres i kilder.
        Polygon og MultiPolygon beholder ringer og hull. Identiteten kontrolleres
        mot valgt kommunenummer, gnr./bnr. og festenummer. Bare dokumenterte
        eiendomsopplysninger beholdes, ingen eierdata.
        Lokale OBJECTID-er blir kildeObjektId, ikke lokalid. Lokal kilde
        mangler grensekvalitet og oppdateringsdato; disse blir ikke oppdiktet.
      properties:
        type: { type: string, enum: [FeatureCollection] }
        koordinatsystem:
          type: string
          enum: ["EPSG:4326", "EPSG:4258"]
          description: Lokal GeoJSON oppgir EPSG:4326. Ved eldre API-svar uten feltet er kilden EPSG:4258.
        features:
          type: array
          items:
            type: object
            required: [type, geometry, properties]
            properties:
              type: { type: string, enum: [Feature] }
              geometry:
                oneOf:
                  - type: object
                    required: [type, coordinates]
                    properties:
                      type: { type: string, enum: [Polygon] }
                      coordinates:
                        type: array
                        items:
                          $ref: "#/components/schemas/GarasjeRing"
                  - type: object
                    required: [type, coordinates]
                    properties:
                      type: { type: string, enum: [MultiPolygon] }
                      coordinates:
                        type: array
                        items:
                          type: array
                          items:
                            $ref: "#/components/schemas/GarasjeRing"
              properties:
                type: object
                required: [kommunenummer, gardsnummer, bruksnummer, festenummer, seksjonsnummer, objekttype, matrikkelnummertekst]
                oneOf:
                  - required: [lokalid]
                  - required: [kildeObjektId, kildefil]
                properties:
                  kommunenummer:
                    type: string
                    pattern: '^(?!0000)\d{4}$'
                  gardsnummer: { type: integer }
                  bruksnummer: { type: integer }
                  festenummer: { type: integer }
                  seksjonsnummer: { type: integer }
                  lokalid: { type: integer }
                  kildeObjektId: { type: integer }
                  kildefil: { type: string }
                  registrertArealM2: { type: number }
                  arealmerknad: { type: [string, "null"] }
                  tinglyst: { type: string }
                  antallMatrikkelenheter: { type: integer, minimum: 0, description: Null som tall betyr ukjent antall i uttrekket, ikke én matrikkelenhet. }
                  objekttype: { type: string, enum: [Teig] }
                  matrikkelnummertekst: { type: string }
                  nøyaktighetsklasseteig: { type: string, enum: [Grønt, Gult, Rødt] }
                  oppdateringsdato: { type: string }
                  hovedområde: { type: boolean }
                  teigmedflerematrikkelenheter: { type: boolean }
                  uregistrertjordsameie: { type: boolean }
    GarasjeBebyggelse:
      type: object
      required: [status, bebygd, bygninger, forklaring, kilde]
      description: >
        Eksisterende bebyggelse fra offentlig bygningskart og geometrisk treff
        på valgt eiendomsteig. Ikke en bekreftet registerkobling til
        matrikkelenheten. Registrert bygningsnummer og bruksstatus brukes som
        kildegrunnlag; geometrien alene dokumenterer ikke bruk eller lovlighet.
        Manglende eller ufullstendige opplysninger gir uavklart, ikke et manuelt ja.
      properties:
        status: { type: string, enum: [bekreftet, uavklart] }
        bebygd: { type: [boolean, "null"] }
        forklaring: { type: string }
        kilde: { type: string, format: uri }
        bygninger:
          type: array
          description: >
            Kartlagte bygningsflater på tomten, ikke en fullstendig opptelling
            av registrerte bygninger. Kartobjekter uten bygningsnummer, type
            eller BRA kan være med.
          items:
            type: object
            required: [id, kobling]
            properties:
              id: { type: string }
              kobling: { type: string, enum: [geometri] }
              objekttype: { type: string }
              bygningsnummer: { type: integer }
              bygningstype: { type: integer }
              bygningstypeNavn: { type: string }
              bygningsstatus: { type: string }
              bygningsstatusNavn: { type: string }
              bruksareal:
                type: number
                description: Registrert BRA fra kilden, ikke BYA eller beregnet utnyttelsesgrad.
    GarasjeArealberegning:
      type: object
      required: [tomtearealM2, kartlagtBebygdArealM2, kartlagtAndelProsent, kilde, metode, forbehold]
      description: >
        Geometrisk kartberegning, ikke juridisk BYA, BRA eller tillatt
        utnyttelsesgrad. Overlappende bygningsflater telles én gang og
        avgrenses til tomten. Manglende grunnlag gir null, ikke null areal.
        Ingen tillatte utnyttelsesgrenser utledes eller gjettes fra kartandelen.
      properties:
        tomtearealM2: { type: [number, "null"] }
        kartlagtBebygdArealM2: { type: [number, "null"] }
        kartlagtAndelProsent: { type: [number, "null"] }
        kilde: { type: string, format: uri }
        metode: { type: string }
        forbehold:
          type: array
          items: { type: string }
    GarasjeNabotomter:
      type: object
      required: [tomter, kilde]
      description: >
        Tomter i kartutsnittet rundt valgt eiendom, med 15 meter margin og høyst
        500 meter langs hver side. Dette er kartkontekst, ikke en bekreftet
        naboliste eller en vurdering av naboenes eiendommer. Alle teiger på
        valgt kommunenummer/gnr/bnr/fnr utelates uansett seksjonsnummer.
        Lokale indekstreff foretrekkes. Ved gyldig tomt utvalg eller udekket
        kommune brukes Kartverkets dokumenterte /eiendom/v1/punkt/omrader,
        med avgrenset radius og maksTreff=201. Over 200 treff gir eksplisitt
        kildefeil uten delvis liste. Lokal kildefeil utløser ikke reserveoppslag.
        Nabokilden holdes utenfor kilder og uavklarteForhold; feil vises gjennom
        kilde.status og kilde.merknad, uten å endre vilkår, areal eller bebyggelse.
        Eierdata, planvilkår og byggetillatelser for naboeiendommer hentes ikke.
      properties:
        tomter:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/GarasjePolygon"
        kilde:
          $ref: "#/components/schemas/GarasjeKilde"
    GarasjeGrunnlag:
      type: object
      required: [adresse, punkt, arealformaal, reguleringsplaner, eiendomsgrenser, bygninger, bebyggelse, arealberegning, kilder, uavklarteForhold]
      properties:
        tiltaksvarsler:
          type: array
          description: >
            Valgfri tidlig planveiledning for oppgitt tiltakstype. Ingen mål kreves,
            og uavklarte lokale vilkår gir aldri automatisk tillatelse.
            Evaluatoren beregner samme regler på nytt og stoler ikke på innsendte varsler.
          items:
            $ref: "#/components/schemas/GarasjeSjekk"
        adresse:
          $ref: "#/components/schemas/GarasjeAdresse"
        punkt:
          $ref: "#/components/schemas/GarasjePunkt"
        arealformaal:
          type: array
          items:
            type: object
            required: [kode, beskrivelse, planId]
            properties:
              kode: { type: integer }
              beskrivelse: { type: string }
              planId: { type: string }
              arealstatus: { type: integer }
              sonenavn:
                type: string
              sonetype:
                type: string
                enum: [sentrumskjerne, byfortettingssone, ytre_fortettingssone, ovrig_byggesone, lnf, gronnstruktur, ukjent]
                description: Klassifisert fra kontrollert kommune, plan, versjon og kodekombinasjon. Ukjent er ikke et byggeforbud eller en tillatelse.
                description: Sonebetegnelse fra kartlagets metadata, ikke en kontroll av tillatt utnyttelse.
        reguleringsplaner:
          type: array
          items:
            type: object
            required: [planId, navn, url]
            properties:
              planId: { type: string }
              navn: { type: string }
              url: { type: string, format: uri }
        eiendomsgrenser:
          type: array
          items:
            $ref: "#/components/schemas/GarasjePolygon"
        eiendomsgeojson:
          $ref: "#/components/schemas/GarasjeEiendomsGeoJson"
        nabotomter:
          $ref: "#/components/schemas/GarasjeNabotomter"
        bygninger:
          type: array
          items:
            $ref: "#/components/schemas/GarasjePolygon"
        bebyggelse:
          $ref: "#/components/schemas/GarasjeBebyggelse"
        arealberegning:
          $ref: "#/components/schemas/GarasjeArealberegning"
        kilder:
          type: array
          description: >
            Inkluderer behovet for KPA2018-bestemmelsene fra b65270000.pdf.
            Denne kilden har status ikke_sjekket så lenge dokumentinnholdet
            ikke er gjort tilgjengelig og kontrollert i løsningen.
          items:
            $ref: "#/components/schemas/GarasjeKilde"
        uavklarteForhold:
          type: array
          items: { type: string }
    GarasjeTiltak:
      type: object
      additionalProperties: false
      required: [bra, bya, gesimshoyde, monehoyde, etasjer, frittliggende, beboelse, kjeller, bebygdEiendom, avstandNabogrense, avstandBygning, overVannAvlop]
      description: >
        Areal i m², høyder og avstander i meter. Gesimshøyde kan ikke overstige
        mønehøyde. null betyr ukjent, aldri automatisk oppfylt.
        bebygdEiendom er et eldre påkrevd inndatafelt. Klienten kan sende null;
        begge vurderingsendepunktene overstyrer feltet fra hentet bebyggelse.
      properties:
        bra: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        bya: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        gesimshoyde: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        monehoyde: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        etasjer: { type: integer, minimum: 1, maximum: 100000 }
        frittliggende: { type: [boolean, "null"] }
        beboelse: { type: [boolean, "null"] }
        kjeller: { type: [boolean, "null"] }
        bebygdEiendom: { type: [boolean, "null"] }
        avstandNabogrense: { type: [number, "null"], minimum: 0, maximum: 100000 }
        avstandBygning: { type: [number, "null"], minimum: 0, maximum: 100000 }
        overVannAvlop: { type: [boolean, "null"] }
    ByggetiltakMetadata:
      type: object
      required: [tiltakstype, tiltaksbeskrivelse, tiltakstypeBekreftet]
      properties:
        tiltakstype: { type: string, enum: [frittliggende, tilbygg, gjerde, fasade, ukjent] }
        tiltaksbeskrivelse: { type: string, minLength: 1, maxLength: 2000 }
        tiltakstypeBekreftet: { const: true }
      description: >
        Beskrivelsen brukes bare til et deterministisk forslag i klienten.
        Innbyggeren må uttrykkelig bekrefte eller endre tiltakstypen.
        Bekreftelse er ikke bevis på at et tiltak er lovlig.
    Byggetiltak:
      oneOf:
        - $ref: "#/components/schemas/FrittliggendeByggetiltak"
        - $ref: "#/components/schemas/TilbyggTiltak"
        - $ref: "#/components/schemas/GjerdeTiltak"
        - $ref: "#/components/schemas/FasadeTiltak"
        - $ref: "#/components/schemas/UkjentByggetiltak"
    FrittliggendeByggetiltak:
      allOf:
        - $ref: "#/components/schemas/ByggetiltakMetadata"
        - type: object
          required: [bra, bya, gesimshoyde, monehoyde, etasjer, frittliggende, beboelse, kjeller, avstandNabogrense, avstandBygning, overVannAvlop]
          properties:
            tiltakstype: { const: frittliggende }
            bra: { type: number, exclusiveMinimum: 0, maximum: 100000 }
            bya: { type: number, exclusiveMinimum: 0, maximum: 100000 }
            gesimshoyde: { type: number, exclusiveMinimum: 0, maximum: 100000 }
            monehoyde: { type: number, exclusiveMinimum: 0, maximum: 100000 }
            etasjer: { type: integer, minimum: 1, maximum: 100000 }
            frittliggende: { type: [boolean, "null"] }
            beboelse: { type: [boolean, "null"] }
            kjeller: { type: [boolean, "null"] }
            bebygdEiendom: { type: [boolean, "null"] }
            avstandNabogrense: { type: [number, "null"], minimum: 0, maximum: 100000 }
            avstandBygning: { type: [number, "null"], minimum: 0, maximum: 100000 }
            overVannAvlop: { type: [boolean, "null"] }
      unevaluatedProperties: false
      description: >
        SAK10 § 4-1 første ledd bokstav a. Samme målekrav som GarasjeTiltak,
        også gesimshøyde høyst mønehøyde. bebygdEiendom kan utelates når tiltakstype
        er oppgitt, normaliseres da til null og overstyres alltid fra serverens oppslag.
    TilbyggTiltak:
      allOf:
        - $ref: "#/components/schemas/ByggetiltakMetadata"
        - type: object
          required: [bra, bya, etasjer, understottet, endrerBruk, nyBoenhet, avstandNabogrense, overVannAvlop]
          properties:
            tiltakstype: { const: tilbygg }
            bra: { type: [number, "null"], minimum: 0, maximum: 100000 }
            bya: { type: [number, "null"], minimum: 0.01, maximum: 100000 }
            etasjer: { type: [integer, "null"], minimum: 1, maximum: 100000 }
            understottet: { type: [boolean, "null"] }
            endrerBruk: { type: [boolean, "null"] }
            nyBoenhet: { type: [boolean, "null"] }
            bebygdEiendom: { type: [boolean, "null"] }
            avstandNabogrense: { type: [number, "null"], minimum: 0, maximum: 100000 }
            overVannAvlop: { type: [boolean, "null"] }
      unevaluatedProperties: false
      description: >
        SAK10 § 4-1 første ledd bokstav b. BRA og BYA høyst 15 m², understøttet,
        høyst to etasjer eller plan, ingen endret godkjent bruk eller ny boenhet.
        Garasjens 1-metersregel gjelder ikke. Avstand, plan og grunnforhold må avklares.
        Ukjente svar er null, aldri utledet som oppfylt. bebygdEiendom kan utelates,
        normaliseres da til null og overstyres alltid fra serverens oppslag.
    GjerdeTiltak:
      allOf:
        - $ref: "#/components/schemas/ByggetiltakMetadata"
        - type: object
          required: [hoyde, motVeg, friSikt, aapenLett]
          properties:
            tiltakstype: { const: gjerde }
            hoyde: { type: [number, "null"], minimum: 0.01, maximum: 100000 }
            motVeg: { type: [boolean, "null"] }
            friSikt: { type: [boolean, "null"] }
            aapenLett: { type: [boolean, "null"] }
      unevaluatedProperties: false
      description: >
        Høyde i meter inkludert sokkel. SAK10 § 4-1 første ledd bokstav f nr. 3
        gjelder åpen, lett innhegning mot vei inntil 1,5 m uten hindret frisikt.
        Bergen plan 6170063 § 7 bokstav d vurderes bare ved dokumentert plantreff:
        kommunal godkjenning av utførelse, høyde og farge og høyst 0,9 m inkludert sokkel.
        Lokal godkjenning, anvendelse og eventuell dispensasjon må avklares, ikke automatisk avslag.
        Ingen garasjemål eller bebygdEiendom skal sendes.
    FasadeTiltak:
      allOf:
        - $ref: "#/components/schemas/ByggetiltakMetadata"
        - type: object
          required: [likUtforming, endrerUtseende, endrerBaering, endrerBrannkrav]
          properties:
            tiltakstype: { const: fasade }
            likUtforming: { type: [boolean, "null"] }
            endrerUtseende: { type: [boolean, "null"] }
            endrerBaering: { type: [boolean, "null"] }
            endrerBrannkrav: { type: [boolean, "null"] }
      unevaluatedProperties: false
      description: >
        Omfatter fasade og tak. Skiller vedlikehold med lik utforming fra mulig
        karakterendring etter pbl. § 20-5 første ledd bokstav f og inngrep i
        bæring eller brannsikring etter § 20-1 første ledd bokstav b.
        Kommunen og kvalifisert fagperson må avklare tvil, vern og lokale krav.
    UkjentByggetiltak:
      allOf:
        - $ref: "#/components/schemas/ByggetiltakMetadata"
        - type: object
          properties:
            tiltakstype: { const: ukjent }
      unevaluatedProperties: false
      description: Uklassifisert eller annet tiltak gir maa_avklares og henvisning til kommunen, aldri automatisk garasjevurdering.
    GarasjeProsessSvar:
      type: object
      additionalProperties: false
      required: [adresse, gnr, bnr, lat, lon, eiendomBekreftet, plasseringBekreftet]
      allOf:
        - if:
            required: [tiltakstype]
          then:
            required: [tiltaksbeskrivelse, tiltakstypeBekreftet]
          else:
            required: [bra, bya, gesimshoyde, monehoyde, etasjer, frittliggende, beboelse, kjeller, avstandNabogrense, avstandBygning, overVannAvlop]
        - if:
            required: [tiltakstype]
            properties:
              tiltakstype: { const: frittliggende }
          then:
            required: [bra, bya, gesimshoyde, monehoyde, etasjer, frittliggende, beboelse, kjeller, avstandNabogrense, avstandBygning, overVannAvlop]
        - if:
            required: [tiltakstype]
            properties:
              tiltakstype: { const: tilbygg }
          then:
            required: [bra, bya, etasjer, understottet, endrerBruk, nyBoenhet, avstandNabogrense, overVannAvlop]
        - if:
            required: [tiltakstype]
            properties:
              tiltakstype: { const: gjerde }
          then:
            required: [hoyde, motVeg, friSikt, aapenLett]
        - if:
            required: [tiltakstype]
            properties:
              tiltakstype: { const: fasade }
          then:
            required: [likUtforming, endrerUtseende, endrerBaering, endrerBrannkrav]
      description: >
        Samlet svar på QUESTION-steget garasje-prosjekt, sendt som svar til /svar
        eller /handling. Tall kan sendes som tall eller desimaltekst med punktum
        eller komma; lagres som tall. Positive arealer og høyder, gesimshøyde
        høyst mønehøyde, helt antall etasjer, ikke-negative avstander.
        Boolsk true/false/null og ja/nei/vet-ikke godtas og lagres som ja/nei/vet-ikke.
        Ukjent avstand kan sendes som null eller vet-ikke og lagres som vet-ikke,
        slik at et uttrykkelig ukjent svar ikke behandles som ubesvart.
        Bekreftelsene må være ja, true eller Bekreftet og lagres som ja.
        Alle feltene valideres på serveren før lagring på begge skriverutene.
        Grunnlag, vurdering, planstatus og andre udokumenterte felter avvises.
        Eksisterende bebyggelse hentes fra eiendomsgrunnlaget, ikke fra brukeren.
        Eldre klienters bebygdEiendom godtas, men lagres ikke og brukes aldri som
        dokumentasjon på bebyggelse.
        Uten tiltakstype gjelder alle eldre garasjefelter. Med tiltakstype kreves
        beskrivelse, bekreftelse og alle spørsmålene for akkurat denne typen.
        Felter fra andre grener avvises selv om de står i det samlede skjemaet her.
        Tilbygg, gjerde og fasade kan svare null eller vet-ikke også på ukjente mål.
        Obligatoriske felles prosessfelter er ikke alene et komplett svar:
        den typespesifikke normaliseringen kjører før lagring og fullføring.
      properties:
        adresse: { type: string, minLength: 3, maxLength: 120 }
        tiltakstype: { type: string, enum: [frittliggende, tilbygg, gjerde, fasade, ukjent] }
        tiltaksbeskrivelse: { type: string, minLength: 1, maxLength: 2000 }
        tiltakstypeBekreftet: { type: [boolean, string], enum: [true, ja, Bekreftet] }
        kommunenummer:
          type: string
          pattern: '^(?!0000)\d{4}$'
          description: Kan utledes fra en entydig eid eiendom når det er utelatt.
        gnr: { type: [number, string], description: Heltall fra 1 til 100000. }
        bnr: { type: [number, string], description: Heltall fra 1 til 1000000. }
        lat: { type: [number, string], description: Gyldig breddegrad nær valgt eiendom. }
        lon: { type: [number, string], description: Gyldig lengdegrad nær valgt eiendom. }
        bra: { type: [number, string, "null"] }
        bya: { type: [number, string, "null"] }
        gesimshoyde: { type: [number, string] }
        monehoyde: { type: [number, string] }
        etasjer: { type: [integer, string, "null"] }
        frittliggende: { type: [boolean, string, "null"] }
        beboelse: { type: [boolean, string, "null"] }
        kjeller: { type: [boolean, string, "null"] }
        bebygdEiendom: { type: [boolean, string, "null"] }
        avstandNabogrense: { type: [number, string, "null"] }
        avstandBygning: { type: [number, string, "null"] }
        overVannAvlop: { type: [boolean, string, "null"] }
        understottet: { type: [boolean, string, "null"] }
        endrerBruk: { type: [boolean, string, "null"] }
        nyBoenhet: { type: [boolean, string, "null"] }
        hoyde: { type: [number, string, "null"] }
        motVeg: { type: [boolean, string, "null"] }
        friSikt: { type: [boolean, string, "null"] }
        aapenLett: { type: [boolean, string, "null"] }
        likUtforming: { type: [boolean, string, "null"] }
        endrerUtseende: { type: [boolean, string, "null"] }
        endrerBaering: { type: [boolean, string, "null"] }
        endrerBrannkrav: { type: [boolean, string, "null"] }
        eiendomBekreftet: { type: [boolean, string], enum: [true, ja, Bekreftet] }
        plasseringBekreftet: { type: [boolean, string], enum: [true, ja, Bekreftet] }
    GarasjeProsessResultat:
      type: object
      required: [melding, grunnlag, vurdering, sporingsId]
      properties:
        melding: { type: string }
        grunnlag:
          $ref: "#/components/schemas/GarasjeGrunnlag"
        vurdering:
          $ref: "#/components/schemas/GarasjeVurdering"
        sporingsId: { type: string }
    GarasjeSjekk:
      type: object
      required: [id, navn, status, forklaring, kilde]
      properties:
        id: { type: string }
        navn: { type: string }
        status: { type: string, enum: [oppfylt, brudd, uavklart] }
        forklaring: { type: string }
        kilde: { type: string, format: uri }
        bestemmelse: { type: string, description: Nøyaktig lov- eller planhenvisning når en bestemt bestemmelse er kontrollert. }
    GarasjeVurdering:
      type: object
      required: [utfall, nasjonaltUnntak, forklaring, sjekker, uavklarteForhold]
      description: >
        Piloten kan ikke gi ikke_soknadspliktig når kommunale og øvrige vilkår
        mangler. Den returnerer da maa_avklares selv om nasjonaltUnntak er oppfylt.
        soknadspliktig betyr at det kontrollerte nasjonale unntaket ikke er oppfylt,
        ikke at en søknad er innsendt eller et vedtak fattet.
        meldeplikt er det ene fritaket piloten kan gi, og bare når hvert ledd i
        hvitelisten i vurderMeldeplikt holder: frittliggende bygning, alle
        nasjonale vilkår oppfylt, skissepunktet på eiendommen, alle kartkilder ok,
        kommuneplanbestemmelsen kontrollert og oppfylt, ingen reguleringsplan og
        ingen faresone på eiendommen, og et meldeskjema for kommunen. Tiltaket skal
        da meldes inn etter ferdigstillelse. Sjekken meldeplikt bærer skjemalenken.
        Utfallet kan variere mellom to ellers like kall, fordi et kartoppslag som
        ikke svarer gir maa_avklares i stedet - manglende kunnskap er aldri et fritak.
      properties:
        tiltakstype: { type: string, enum: [frittliggende, tilbygg, gjerde, fasade, ukjent] }
        utfall: { type: string, enum: [ikke_soknadspliktig, meldeplikt, soknadspliktig, maa_avklares] }
        nasjonaltUnntak: { type: string, enum: [oppfylt, brudd, uavklart] }
        forklaring: { type: string }
        sjekker:
          type: array
          items:
            $ref: "#/components/schemas/GarasjeSjekk"
        nesteSteg:
          type: array
          items: { type: string }
          description: Konkrete avklaringer og dokumentasjon innbyggeren kan ta til kommunen eller en kvalifisert fagperson.
        uavklarteForhold:
          type: array
          items: { type: string }
    Helse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        tjeneste:
          type: string
        tidspunkt:
          type: string
          format: date-time
    Kontakt:
      type: object
      description: >
        Tenor-importerte personer har `kontakt: {}` - ingen nøkler i det hele
        tatt. Nøkkelsettet er frosset wire-format.
      properties:
        epost:
          type: string
          nullable: true
        telefon:
          type: string
          nullable: true
    Adresse:
      type: object
      description: >
        For en adressebeskyttet person er adressenavn, husnummer, postnummer og
        poststed null. Kommune og kommunenummer overlever med vilje: regelmotoren
        vurderer mot kommunens eget tilbud, og uten kommunenummer ville en
        skjermet person mistet retten til tjenester.
      properties:
        adressenavn:
          type: string
          nullable: true
        husnummer:
          type: integer
          nullable: true
        postnummer:
          type: string
          nullable: true
        poststed:
          type: string
          nullable: true
        kommune:
          type: string
        kommunenummer:
          type: string
    Person:
      type: object
      description: >
        Adressebeskyttelse brukes ved innlasting, i skjerming.ts, og gjelder
        derfor alle lesere. STRENGT_FORTROLIG (kode 6) mister navn og adresse:
        navnet blir «Skjermet person». FORTROLIG (kode 7) mister adressen og
        beholder navnet. Begge beholder fødselsnummer, fødselsdato, husstandId og
        kommunenummer - beregningen og regelmotoren trenger dem, og uten dem
        ville skjermingen stilt personen utenfor tjenestene sine.
      properties:
        personId:
          type: string
        syntetiskFodselsnummer:
          type: string
          description: Overlever maskeringen. Nøkkelen mot inntektsopplysningene i Fiks.
        navn:
          type: object
          properties:
            fornavn:
              type: string
            mellomnavn:
              type: string
              nullable: true
            etternavn:
              type: string
        foedselsdato:
          type: string
          format: date
        personstatus:
          type: string
          enum: [BOSATT, UTFLYTTET, DOED, INAKTIV, MIDLERTIDIG, OPPHOERT, FORSVUNNET]
          description: >
            Folkeregisterpersonstatus. Bare BOSATT er medlem av en husstand og kan
            være part i en prosess. De fem verdiene BOSATT, UTFLYTTET, DOED,
            OPPHOERT og INAKTIV er de eneste som ikke er taushetsbelagte i det
            ekte registeret.
        doedsdato:
          type: string
          format: date
          nullable: true
          description: Satt hvis og bare hvis personstatus er DOED.
        bostedsadresse:
          $ref: "#/components/schemas/Adresse"
        sivilstand:
          type: string
          enum: [UGIFT, GIFT, SEPARERT, ENKE_ELLER_ENKEMANN, UOPPGITT]
        rolle:
          type: string
          nullable: true
          enum: [foresatt, barn, voksen, null]
          description: >
            Rollen inne i husstanden. `voksen` er en myndig person som ikke er
            forelder til noe barn i husstanden - regelmotoren summerer bare
            `foresatt`. null for alle som ikke er BOSATT: de har ingen husstand.
        husstandId:
          type: string
          nullable: true
          description: null for alle som ikke er BOSATT.
        skjermet:
          type: boolean
          description: True for både FORTROLIG og STRENGT_FORTROLIG.
        adressebeskyttelse:
          type: string
          enum: [UGRADERT, FORTROLIG, STRENGT_FORTROLIG]
        foreldrebarnrelasjon:
          type: array
          items:
            type: object
            properties:
              relatertPersonId:
                type: string
              relasjon:
                type: string
                enum: [BARN, FAR, MOR, MEDMOR]
                description: >
                  Den relaterte personens rolle overfor denne personen. Kantene
                  går alltid begge veier: en MOR-kant har en BARN-kant tilbake.
        foreldreansvar:
          type: string
          nullable: true
          enum: [felles, mor, far, medmor, andre, ukjent, null]
          description: >
            Hvem som har foreldreansvar for denne personen. Speilet fra
            Folkeregisteret, ikke utledet av foreldrelisten - en far kan være far
            uten å ha foreldreansvar. Grunnlaget for hvem som kan være avsender
            for en mindreårig.
        kontakt:
          $ref: "#/components/schemas/Kontakt"
        syntetisk:
          type: boolean
    Husstand:
      type: object
      properties:
        husstandId:
          type: string
        type:
          type: string
          example: ENSLIG_FORSORGER
        adresse:
          type: string
          nullable: true
          description: >
            Null bare når alle medlemmene er skjermet. En adresse man deler med
            en umaskert medboer kan ikke skjules - medboerens egen post viser den
            uansett.
        kommune:
          type: string
          description: Visningsnavn. kommunenummer er nøkkelen.
        kommunenummer:
          type: string
          description: Nøkkelen som joiner mot matrikkelen og tjenestetilbudet.
        medlemmer:
          type: array
          items:
            type: object
            properties:
              personId:
                type: string
              rolle:
                type: string
                enum: [foresatt, barn, voksen]
        kilde:
          type: string
          enum: [tenor]
          description: >
            Bare på de importerte. De frosne fixturene har ingen kilde - de er
            forfattet, og ligger i data/kuratert.json.
        scenario:
          type: string
          description: >
            Hva husstanden er. På de 18 frosne fixturene er teksten forfattet og
            sier hva husstanden demonstrerer; på de importerte er den utledet av
            husstandstypen, slik at de to ikke kan motsi hverandre.
        syntetisk:
          type: boolean
    Barnehageplass:
      type: object
      properties:
        personId:
          type: string
        barnehageId:
          type: string
        barnehagenavn:
          type: string
        kommune:
          type: string
        plassprosent:
          type: integer
        manedspris:
          type: integer
        syntetisk:
          type: boolean
    Sfoplass:
      type: object
      properties:
        personId:
          type: string
        sfoId:
          type: string
        sfonavn:
          type: string
        kommune:
          type: string
        trinn:
          type: integer
        manedspris:
          type: integer
        syntetisk:
          type: boolean
    Fritidsdeltakelse:
      type: object
      properties:
        personId:
          type: string
        aktivitetId:
          type: string
        aktivitetsnavn:
          type: string
        arrangoer:
          type: string
        kommune:
          type: string
        manedspris:
          type: integer
        syntetisk:
          type: boolean
    Kontaktinfo:
      type: object
      description: >
        KRR-raden fra fiks-simulator, uendret - se openapi/fiks-simulator.yaml
        for hele formen - eller advarselsformen når oppslaget ikke fikk svar.
        Adressebeskyttede personer (kode 6/7) får epost og tlf nullet av
        simulatoren; reservert, spraak og kanVarsles beholdes.
      properties:
        fnr:
          type: string
        epost:
          type: object
          nullable: true
          description: Null når personen ikke har registrert e-post, og for adressebeskyttede.
        tlf:
          type: object
          nullable: true
        status:
          type: string
        reservert:
          type: boolean
        kanVarsles:
          type: boolean
        spraak:
          type: string
          description: nb, nn eller en. Lånt fra Digdirs KRR - se fiks-simulator.yaml.
        advarsel:
          type: string
          description: >
            Bare i advarselsformen: oppslaget fikk ikke noe svar, og detalj
            sier hvorfor. Reservasjonsstatus er da ukjent.
        detalj:
          type: string
        syntetisk:
          type: boolean
    Soknad:
      type: object
      properties:
        soknadId:
          type: string
        personId:
          type: string
        prosessId:
          type: string
        status:
          type: string
          enum: [SENDT_INN]
        opprettet:
          type: string
          format: date-time
        sporingsId:
          type: string
        syntetisk:
          type: boolean
        soknadsdokument:
          type: string
          description: >
            Deterministisk tekstdokument bygget av svarene, de innhentede
            opplysningene og sjekk-resultatet: prosessnavn/versjon, søkerens navn
            og id, spørsmålssvarene, toppnivå-primitiver fra hvert
            DATA_FETCH-resultat, sjekk-stegets utfall og oppsummeringsteksten hvis
            den finnes. Bare til stede når søknaden kom fra et SUBMIT-steg i en
            prosessøkt - POST /api/soknader direkte har det aldri.
        forsendelseId:
          type: string
          description: >
            SvarUt-forsendelsen kvitteringen ble sendt som. Bare til stede når
            utsendingen gikk gjennom - feilet den, står advarselen i `forsendelse`
            på SUBMIT-svaret og raden har ingen id. Nøkkelen
            GET /api/soknader/{soknadId}/forsendelse slår opp på.
    SoknadMedOppgave:
      allOf:
        - $ref: "#/components/schemas/Soknad"
        - type: object
          properties:
            oppgave:
              description: >
                Oppgaven fiks-simulator opprettet, eller advarselen om at den
                ikke ble opprettet - en søknad uten oppgaveId sier hvorfor.
              type: object
              properties:
                oppgaveId:
                  type: string
                advarsel:
                  type: string
                detalj:
                  type: string
                syntetisk:
                  type: boolean
            forsendelse:
              description: >
                SvarUt-kvitteringen, eller advarselen om at den ikke ble sendt.
                Bare til stede når søknaden kom fra et SUBMIT-steg - POST
                /api/soknader direkte sender ingen kvittering.

                Best effort på samme måte som oppgaven: en kvittering som ikke
                kan sendes velter aldri innsendingen, og søknaden er lagret
                uansett. En mottaker uten digital kanal og uten gyldig
                postadresse - en skjermet person uten KRR-rad er nettopp det -
                havner her som en advarsel, ikke som en feil innbyggeren betaler
                for. Verken adressen eller kontaktinformasjonen står i svaret.

                Kanalen velges av SvarUt, ikke av backend: fødselsnummeret sendes
                som `mottaker.digitalId`, og SvarUt slår det opp i KRR selv.
                Statusen leses etterpå med
                GET /api/soknader/{soknadId}/forsendelse.
              type: object
              properties:
                id:
                  type: string
                advarsel:
                  type: string
                detalj:
                  type: string
                syntetisk:
                  type: boolean
    Forsendelsesstatus:
      type: string
      description: >-
        Kodeverket ligger i apps/fiks-simulator/src/forsendelse.ts og gjengis her
        fordi denne ruten svarer med det. Utledes av tid, skrives aldri. LEST,
        PRINTET og IKKE_LEVERT er sluttilstander - der kan en poller slutte.
      enum: [MOTTATT, SENDT_DIGITALT, SENDT_PRINT, IKKE_LEVERT, LEST, PRINTET]

    Forsendelsesstatussvar:
      type: object
      description: >
        Statusen på én forsendelse, slik SvarUt svarte om den. Ingenting om
        mottakeren står her - hvilket brev som gikk ut og hvor langt det har
        kommet er spørsmålet ruten svarer på, og adressen hører ikke med.
      properties:
        id:
          type: string
          description: Forsendelses-id-en, den samme som `forsendelseId` på søknaden.
        status:
          $ref: "#/components/schemas/Forsendelsesstatus"
        sisteStatusEndring:
          type: string
          format: date-time
          description: >
            Da forsendelsen gikk *inn* i statusen over, ikke da noen spurte.
            Utledet sammen med statusen.
        syntetisk:
          type: boolean

    Inntektsgrunnlag:
      type: object
      description: >
        Svaret fra fiks-simulator sitt register-API, beregningstype
        BARNEHAGE_SFO. Modellen er Fiks sin egen - se openapi/fiks-simulator.yaml
        for hele formen. Husholdningsinntekten er summen for alle foresatte i
        husstanden, jf. forskrift om foreldrebetaling, og for en husstand med to
        foresatte betyr det at også den andres skattedata leses. Revisjonsloggen
        fører begge i `omfatter`.
      properties:
        inntektsaar:
          type: integer
        stadie:
          type: string
          enum: [OPPGJOER, UTKAST, UKJENT]
        beregningsbeloep:
          type: integer
          format: int64
          description: Grunnlaget etter fradrag. Tallet regelsjekken måler mot.
        personer:
          type: array
          items:
            type: object
        visningsposter:
          type: array
          description: >
            Oppstilling per inntektstype. Et skjermet husstandsmedlem teller med
            i summen, men beløpet spesifiseres ikke på personen.
          items:
            type: object
        inntekt:
          type: object
        fradrag:
          type: object
        feilmeldinger:
          type: array
          items:
            type: object
            properties:
              kode:
                type: string
              melding:
                type: string
        syntetisk:
          type: boolean
    SjekkResultat:
      type: object
      description: >
        Kontrakten et SJEKK-steg må oppfylle. Er godkjent false, settes
        prosessoekten til AVVIST og melding blir avvistMelding.
        TT-kort krever at legeerklæringen uttrykkelig sier at søkeren ikke kan
        bruke kollektivtransport. Ellers er godkjent false og
        grunnlag.avslagsgrunn kollektivbehov_ikke_dokumentert; transportbehovet
        må avklares før innvilgelse. Tidligere avslagsgrunner, som visusgrensen,
        vurderes først. Alder og dokumentgyldighet vurderes ved satser.gjelderFra,
        ikke dagens dato.
        Se docs/prosessmodell.md.
      required: [godkjent, melding]
      properties:
        godkjent:
          type: boolean
        utfall:
          type: string
          enum: [godkjent, avvist, til_manuell]
          description: >
            Arten av utfallet, for den som skal skrive det ut. `godkjent` er toveis
            fordi den styrer rutingen, men et utfall kan slippe gjennom uten å være
            et ja: en anmerkning ingen lov utelukker skal til en saksbehandler, og
            «Godkjent» er feil ord om den. Settes av regelen, ikke av kallstedet.
        melding:
          type: string
        grunnlag:
          type: object
          description: >
            Opplysningene og den ordningsspesifikke kilden bak utfallet. Feltene
            varierer med regeltypen.
    Feil:
      type: object
      description: >
        Feilformen alle ruter deler. `feil` er meldingen på norsk. `grunn` er
        maskinlesbar og skiller de to 403-ene fra hverandre: mangler_hjemmel,
        mangler_samtykke og utloept_samtykke er tre forskjellige svar på «nei».
      properties:
        feil:
          type: string
        grunn:
          type: string
          enum: [mangler_hjemmel, mangler_samtykke, utloept_samtykke]
        detalj:
          type: string
        hint:
          type: string
        syntetisk:
          type: boolean
    MatrikkelGate:
      type: object
      description: >
        Nøkkeltall for én gate. Eiendomslisten er med vilje ikke med: den
        inneholder personId-ene til andre innbyggere i gaten.
      properties:
        gateId:
          type: string
        adressenavn:
          type: string
        kommune:
          type: string
        kommunenummer:
          type: string
        postnummer:
          type: string
        poststed:
          type: string
        antallEiendommer:
          type: integer
        antallBoligeiendommer:
          type: integer
        syntetisk:
          type: boolean
    MatrikkelGateSummary:
      type: object
      required: [gateId, adressenavn, kommune, antallEiendommer, antallBoligeiendommer]
      properties:
        gateId:
          type: string
        adressenavn:
          type: string
        kommune:
          type: string
        antallEiendommer:
          type: integer
        antallBoligeiendommer:
          type: integer
    MineEiendommer:
      type: object
      required: [personId, eiendommer, syntetisk]
      properties:
        personId:
          type: string
        eiendommer:
          type: array
          items:
            $ref: "#/components/schemas/MinEiendom"
        syntetisk:
          type: boolean
    MinEiendom:
      type: object
      description: >
        Projeksjon, ikke matrikkelenheten: eierlisten er utelatt med vilje, så
        medeiere ikke følger med ut av matrikkelen.
      required: [matrikkelId, adresse]
      properties:
        matrikkelId:
          type: string
        adresse:
          type: string
        kommunenummer:
          type: string
          description: Eiendommens kommune, ikke nødvendigvis søkerens bostedskommune.
        gnr:
          type: integer
        bnr:
          type: integer
        bruksenhetstype:
          type: string
        gate:
          type: string
        kommune:
          type: string
    RedigeringMeta:
      type: object
      description: Valgfri metadata for enklere redigering av prosessdefinisjoner.
      additionalProperties: true
      properties:
        status:
          type: string
          description: For eksempel publisert eller template.
        mal:
          type: boolean
          description: Marker prosessen som mal i katalogen.
        eier:
          type: string
        hjelpetekst:
          type: string
    ProsessSteg:
      type: object
      additionalProperties: true
      required: [id, type]
      properties:
        id:
          type: string
        type:
          type: string
        tittel:
          type: string
        tekst:
          type: string
        visning:
          type: string
          enum: [garasje]
          description: >
            Valgfri presentasjon, bare på QUESTION. Garasjevisningen samler
            GarasjeProsessSvar i ett steg; felter er fortsatt den deklarative
            kontrakten for klienter som viser ett felt om gangen.
    ProsessDefinisjonInput:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        navn:
          type: string
        beskrivelse:
          type: string
        versjon:
          type: string
        avslutning:
          type: string
          enum: [veiledning]
          description: >
            Valgfri fullføring uten søknad. Krever siste steg DATA_FETCH og
            tillater ikke SUBMIT. Manglende felt beholder eksisterende oppførsel.
        redigering:
          $ref: "#/components/schemas/RedigeringMeta"
        steg:
          type: array
          items:
            $ref: "#/components/schemas/ProsessSteg"
    ProsessDefinisjon:
      allOf:
        - $ref: "#/components/schemas/ProsessDefinisjonInput"
        - type: object
          required: [id, navn, versjon, steg]
          properties:
            syntetisk:
              type: boolean
