openapi: 3.1.0
info:
  title: Process Agent API
  version: 0.1.0
  description: Generic process guide agent powered by the tools-api endpoints.
servers:
  - url: http://localhost:8084
# Ingen av rutene her krever token, og det er et valg, ikke en glipp.
# process-agent er en intern orkestrator som kaller tools-api og ai-gateway. Den verifiserer ingen innkommende token, og har ingen egen ressurs å beskytte.
# En tom security på dokumentnivå gjelder alle operasjonene under paths.
security: []

paths:
  /helse:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /docs:
    get:
      summary: Ruteoversikt som HTML
      security: []
      description: >
        Generert av spesifikasjonen, ikke skrevet for hånd: en håndskrevet liste er
        en tredje sannhet ved siden av koden og filen, og den driver i stillhet.
      responses:
        "200":
          description: HTML-side
          content:
            text/html:
              schema:
                type: string
  /openapi.yaml:
    get:
      summary: Denne spesifikasjonen
      security: []
      description: >
        Tjenesten serverer sin egen spesifikasjon fra openapi/. Filen og koden
        holdes i takt av scripts/sjekk-openapi-dekning.ts.
      responses:
        "200":
          description: OpenAPI-dokumentet
          content:
            text/yaml:
              schema:
                type: string
  /openapi-ruter.json:
    get:
      summary: Spesifikasjonen lest, som JSON
      security: []
      description: >
        Den samme spesifikasjonen som /openapi.yaml, lest av
        apps/shared/openapi.ts: én oppføring per operasjon, med sammendrag,
        hjemmel og parametere. Finnes fordi en nettleser ikke kan lese YAML uten en
        parser, og sandkassen har ingen. Dette er kilden API-utforskeren på
        http://localhost:3001/utforsker rendrer.
      responses:
        "200":
          description: Ruteoversikten
          content:
            application/json:
              schema:
                type: object
                properties:
                  tjeneste: { type: string }
                  beskrivelse: { type: string }
                  server: { type: string }
                  ruter:
                    type: array
                    items:
                      type: object
                      properties:
                        sti: { type: string }
                        metode: { type: string }
                        linje: { type: integer }
                        sammendrag: { type: string }
                        beskrivelse: { type: string }
                        security:
                          type: array
                          items: { type: string }
                          description: Ordningene ruten godtar. Tom liste betyr åpen.
                        scopes:
                          type: array
                          items: { type: string }
                        parametere:
                          type: array
                          items:
                            type: object
                            properties:
                              navn: { type: string }
                              plassering: { type: string }
                              paakrevd: { type: boolean }
                              eksempel: { type: string }
                              beskrivelse: { type: string }
                        kroppEksempel: { type: string }
  /agent/garasje/dialog:
    post:
      summary: Forklar eller tolk ett felt i garasjeutkastet
      security: []
      description: >
        Statsløs hjelp til utfylling, uten person, agentøkt eller prosessøkt.
        Et entydig svar tolkes med den samme feltparseren som garasjeintervjuet.
        Et tall, ja, nei eller uttrykkelig ukjent returneres bare som et forslag.
        Klienten må be innbyggeren velge «Bruk svaret» før utkastet endres.
        Spørsmål og forklaringer går til answer_citizen_question med tjeneste,
        prosess og aktivt felt satt av serveren. KI-tjenestens eksisterende
        personvernfilter begrenser konteksten til offentlige kartopplysninger.
        KI beregner ikke målene og avgjør ikke om det er lov å bygge.
        Ruten lagrer ingenting og kaller aldri verktøy som besvarer, utfører
        eller flytter et prosess-steg. Spørsmål kan inngå i eksisterende KI-spor.
        Et utilgjengelig verktøy gir lokal hjelpetekst med advarsel; modellnavn og
        advarsel fra KI-tjenestens eget reservesvar videreformidles uendret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GarasjeDialogRequest"
      responses:
        "200":
          description: Et svarforslag, en forklaring eller hjelp til å rette feltverdien
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarasjeDialogResponse"
        "400":
          description: Ugyldig JSON, ukjent felt, for lang tekst eller ugyldig kontekst
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
  /agent/sessions:
    post:
      summary: Create an agent session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
  /agent/sessions/{sessionId}:
    get:
      summary: Get session status
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStateResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
  /agent/sessions/{sessionId}/messages:
    post:
      summary: Send message to agent
      description: >
        Tekst velger prosess eller besvarer steget. Et strukturert svar fra
        garasjeskjemaet går direkte til prosessmotorens aktive QUESTION med
        visning garasje og samme stegId. Det lagres før agenten går videre.
        Samtidige meldinger til samme agentøkt avvises med 409.
        Spørsmål om garasjebegreper og måling besvares via spørsmålstjenesten
        uten å flytte steget. Det gjeldende feltet og svarene beholdes også når
        forklaringstjenesten feiler.
        Tall i garasjedialogen tolkes per felt: «49 m2» og «49,5 m²» blir areal,
        «3 meter» blir en lengde og «1 etasje» blir et heltall. Uklart tallformat,
        feil enhet og negative mål gir et nytt spørsmål om samme felt med en gang,
        ikke et lagret svar. «Vet ikke» tillates for avstander. Valg og bekreftelser
        utledes ikke fra fritekstspørsmål.
        Når brukeren uttrykkelig velger en entydig adresse fra «mine eiendommer»,
        brukes gnr, bnr og eventuelt kommunenummer fra det allerede utførte oppslaget.
        Like adresser må avklares med kommune. Bekreftelse av eiendommen og valg av
        garasjens skissepunkt må fortsatt gis uttrykkelig; adressepunktet brukes ikke
        som garasjeplassering. Uten registerfeltene beholdes vanlig feltinnsamling.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: Agent replies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
        "400":
          description: Ugyldig JSON, svarform eller feltverdi fra prosessmotoren
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
        "409":
          description: Agentøkten er opptatt, prosessøkten er avsluttet, eller svaret gjelder feil steg
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"

components:
  schemas:
    GarasjeDialogRequest:
      type: object
      additionalProperties: false
      required: [tekst, feltId]
      properties:
        tekst:
          type: string
          minLength: 1
          maxLength: 500
          description: Ett felt-svar eller et spørsmål. Bare blanke tegn er ikke tillatt.
          examples: ["49 m²", "3 meter", "vet ikke", "Hva er gesimshøyde?"]
        feltId:
          type: string
          enum: [bya, bra, gesimshoyde, monehoyde, etasjer, avstandNabogrense, avstandBygning, frittliggende, beboelse, kjeller, overVannAvlop]
          description: Felt fra GARASJE_DIALOGFELTER i apps/shared/garasje-dialog.ts.
        sporingsId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[a-zA-Z0-9_-]+$"
          description: Valgfri korrelasjon for KI-sporet, ikke en prosessøkt.
        kontekst:
          type: object
          additionalProperties: false
          description: >
            Bare offentlig kartgrunnlag og samtale. Maksimalt 30000 tegn som JSON.
            Ingen persondata, sesjonsidentifikatorer eller overstyring av tjeneste
            og felt. KI-tjenesten projiserer kartgrunnlaget før modellen kalles.
          properties:
            resultater:
              type: object
              additionalProperties: true
              description: Offentlige kartresultater fra garasjesjekken, ikke rå person- eller eierdata.
            samtale:
              type: array
              maxItems: 6
              items:
                type: object
                additionalProperties: false
                required: [rolle, tekst]
                properties:
                  rolle:
                    type: string
                    enum: [innbygger, assistent]
                  tekst:
                    type: string
                    maxLength: 2000
                    description: De første 400 tegnene sendes til forklaringstjenesten.
    GarasjeDialogResponse:
      type: object
      additionalProperties: false
      required: [type, tekst]
      properties:
        type:
          type: string
          enum: [svar, sporsmaal, ugyldig]
        tekst:
          type: string
        svar:
          type: [number, boolean, "null"]
          description: >
            Bare ved type svar. Areal og høyder må være positive, etasjer et heltall
            fra 1. Avstander kan være 0. Utkastets grenser er 10000 for areal og
            avstander, 100 for høyder og etasjer. Ukjent avstand og ukjente valg
            blir null, aldri et antatt nei. Ingen vurdering av søknadsplikt.
        modell:
          type: string
          description: Modellnavnet som forklaringstjenesten oppgir, også ved reservesvar.
        advarsel:
          type: string
        grunnlag:
          description: Kilder og avgrensninger fra forklaringstjenesten.
    HealthResponse:
      type: object
      required: [status, tjeneste, tidspunkt]
      properties:
        status:
          type: string
          example: ok
        tjeneste:
          type: string
          example: process-agent
        tidspunkt:
          type: string
          format: date-time
    AgentError:
      type: object
      required: [feil]
      properties:
        feil:
          type: string
        detalj:
          type: string
    ProcessSummary:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        navn:
          type: string
        beskrivelse:
          type: string
        antallSteg:
          type: integer
    CreateSessionRequest:
      type: object
      additionalProperties: true
      properties:
        personId:
          type: string
          description: Optional. Defaults to person-001.
    CreateSessionResponse:
      type: object
      required: [sessionId, personId, message]
      properties:
        sessionId:
          type: string
        personId:
          type: string
        message:
          type: string
          description: Initial prompt listing available processes.
    SessionStateResponse:
      type: object
      required: [sessionId, personId, awaiting, created, updated]
      properties:
        sessionId:
          type: string
        personId:
          type: string
        selectedProcess:
          oneOf:
            - $ref: "#/components/schemas/ProcessSummary"
            - type: "null"
        pendingProcessCandidates:
          type: array
          items:
            $ref: "#/components/schemas/ProcessSummary"
        oektsId:
          oneOf:
            - type: string
            - type: "null"
        sporingsId:
          oneOf:
            - type: string
            - type: "null"
        awaiting:
          description: >
            Ventetilstand i agenten. process_end betyr at siste steg uten innsending
            er gjennomført; motorøkten er fortsatt åpen og ingen søknad er sendt.
            null alene beviser ikke innsending, siden en avvist prosess også avslutter dialogen.
          oneOf:
            - type: string
            - type: "null"
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
    SendMessageRequest:
      type: object
      additionalProperties: true
      dependentRequired:
        svar: [stegId]
        stegId: [svar]
      properties:
        message:
          type: string
          description: User message for the current session state.
        stegId:
          type: string
          minLength: 1
          description: Må være id for det aktive QUESTION-steget med visning garasje.
          example: garasje-prosjekt
        svar:
          type: object
          additionalProperties: true
          description: >
            Hele svarobjektet fra garasjeskjemaet, med feltene som prosessdefinisjonen
            ber om. Prosessmotoren validerer verdiene. Tall og boolske verdier sendes
            som JSON-verdier; ukjente verdier følger feltets kontrakt. Når både svar
            og message er oppgitt, brukes svar som stegsvaret. message tolkes ikke.
    SendMessageResponse:
      type: object
      required: [sessionId, replies, awaiting]
      properties:
        sessionId:
          type: string
        replies:
          type: array
          description: >
            Svar til innbyggeren. Adresseoppslag beholder oppgitt postnummer og
            poststed. Ugyldige eller tvetydige oppslag forklares uten å flytte
            prosessteget; en 409 fra verktøyet omtales ikke som en ukjent adresse.
            Agenten beholder det ventende oppslaget til adressen er avklart eller
            innbyggeren skriver «avbryt oppslaget». Postnummer i neste melding
            brukes til oppslaget, ikke som svar på søknadsspørsmålet.
          items:
            type: string
        awaiting:
          description: >
            Ventetilstand etter meldingen. process_end stopper ved siste steg uten
            innsending. Verktøyforslag uten støtte varsles i replies, ikke som
            vellykket validering. Fullført veiledning har null og betyr ikke at en
            søknad er sendt inn; dette krever et lagret SUBMIT-resultat.
          oneOf:
            - type: string
            - type: "null"
        selectedProcess:
          oneOf:
            - $ref: "#/components/schemas/ProcessSummary"
            - type: "null"
        pendingProcessCandidates:
          type: array
          items:
            $ref: "#/components/schemas/ProcessSummary"
        oektsId:
          oneOf:
            - type: string
            - type: "null"
        sporingsId:
          oneOf:
            - type: string
            - type: "null"
